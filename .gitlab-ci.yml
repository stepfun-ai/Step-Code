# StepCode Desktop: installers (macOS dmg, Windows NSIS), Developer ID signing
# and notarization, and tag-driven releases to TOS. The CLI/TUI lint, test,
# tag, package, publish and notify jobs come from the default branch.
#
# This file lives only on CI branches: it carries .gitlab-ci.yml and
# object-store upload code, exactly as feat/stepcode-web-mvp-gh-build and
# feat/stepcode-desktop-mvp-build do. Those branches also dropped
# `pnpm run check:public-boundary` and the public-tree observability guard from
# `check`; after merging the default branch this tree also carries the internal
# telemetry implementation, so neither guard ships here.
#
# Two ways in:
#
# 1. Release (tag-driven; the version comes only from the tag), one pipeline.
#    Run pipeline on DESKTOP_RELEASE_BRANCH (or the default branch) with
#    DESKTOP_BUMP = patch | minor | major and nothing else. desktop_tag_release
#    (infra/release/desktop-tag-release.mjs) pushes the next protected tag
#    desktop-vX.Y.Z on that commit (the first one is desktop-v0.1.0) with
#    ci.skip, and hands its version to the rest of this same pipeline, which
#      - signs and notarizes the mac app for arm64 and x64
#        (.gitlab-ci.desktop-macos-signing.yml) and wraps each stapled app into
#        a dmg + zip,
#      - with DESKTOP_RELEASE_WINDOWS=true (off for now: the Windows packager
#        is down), builds the Windows NSIS installer on the Windows packager
#        and signs it with the GlobalSign EV token (stepcode-desktop-release-windows),
#      - uploads the installers to the test bucket automatically
#        (desktop_upload_test), and to the production bucket on a manual click
#        (desktop_upload_prod). desktop/latest.json is uploaded last in each
#        bucket, so the channel never names a file that is not there yet.
#    Every installer, app.getVersion() and the packaged stepcode-release.json
#    carry X.Y.Z; nothing in the tree is edited for a release. A pipeline run
#    on an existing desktop-v* tag repeats that release (e.g. after a failure).
#    The tag is pushed without a pipeline of its own because a tag pipeline
#    would run as the token's bot user, which cannot read the falcon includes.
#
# 2. Ad-hoc packaging through falcon (catalyst/falcon-mobile-pipeline).
#    Run pipeline with DESKTOP_BUMP=none builds an unsigned macOS arm64 dmg as
#    a job artifact; nothing is tagged or uploaded. The defaults below pick
#    that build; to get another one, add the variable by hand in the Run
#    pipeline form (or pass it through the API):
#      BUILD_PLATFORM=windows           the unsigned Windows x64 installer
#      BUILD_PROFILE=qa                 macOS arm64 + x64
#      MACOS_SIGNING_ENABLED=true       signed + notarized macOS arm64 + x64
#                                       (protected branch), at the root
#                                       package.json version
#
# The Run pipeline form shows only DESKTOP_BUMP and BUMP: GitLab lists the
# variables that carry a `description`, and every other one here is a plain
# default. falcon's stages/variables.yml (the mobile form: iOS/Android profiles,
# APK channels, market submission, ...) is deliberately not included. falcon's package.yml / publish.yml are not included
# either: they add FE callbacks and falcon's own TOS uploads; releases here go
# through infra/release/desktop-release.mjs.
#
# Credentials are CI variables, never values in this file:
#   upload, test bucket:  STEP_TOS_ENDPOINT, STEP_TOS_REGION, STEP_TOS_BUCKET,
#                         STEP_TOS_ACCESS_KEY, STEP_TOS_SECRET_KEY, STEP_TOS_PREFIX
#   upload, production:   STEP_TOS_PROD_ACCESS_KEY, STEP_TOS_PROD_SECRET_KEY
#                         (bucket and endpoint below)
#   tagging:              STEP_RELEASE_TOKEN (protected; api + write_repository
#                         scopes, allowed to create the protected desktop-v* and
#                         v* tags)
#   signing/notarization: see .gitlab-ci.desktop-macos-signing.yml
#   npm publishing:       NPM_TOKEN (masked, deploy rights on STEP_NPM_REGISTRY)
#   usage telemetry:      config/usage-telemetry.yaml (collector endpoint + internal
#                         gateway hosts), committed with no values in the public
#                         tree. A GitLab File variable STEPCODE_USAGE_TELEMETRY_CONFIG
#                         overrides it for one job. Empty means the build reports nothing.
#
# Ported CLI/TUI jobs: the desktop jobs below and the CLI jobs share this file.
# A CLI job never uses falcon, so each one gets `before_script: []` through
# `.cli-docker-job`; without it the falcon include's global before_script would
# clone the falcon toolchain in the release-builder image.

workflow:
  rules:
    # A pipeline on an existing desktop release tag (a pushed tag, or Run pipeline on it).
    - if: '$CI_COMMIT_TAG =~ /^desktop-v\d+\.\d+\.\d+$/'
    # A CLI/TUI release tag runs the ported default-branch release jobs.
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
    # Everything else starts from Run pipeline or the platform's API trigger. A
    # branch push would create a pipeline whose jobs are all ruled out, which
    # GitLab reports as failed and which then blocks the merge request.
    - if: '$CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api" || $CI_PIPELINE_SOURCE == "trigger"'

# Every include below is loaded only for a pipeline that can run desktop jobs:
# Run pipeline, the API/trigger, or a desktop-v* tag. GitLab resolves includes
# before it applies the workflow rules, and the falcon files need read access
# to catalyst/falcon-mobile-pipeline. Loaded on every pipeline, a branch push or
# merge request from someone without that access failed as "yaml invalid"
# instead of being filtered out. Now a push loads none of them, the workflow
# rules drop it, and no pipeline is created. A CLI v* tag pipeline loads none
# of them either: the CLI jobs need neither falcon nor the desktop files.
include:
  # Brings the global before_script (falcon toolchain clone and prepare.sh), the
  # .scripts.initial-env / .scripts.import-ci-env references and a stages list.
  # Jobs that do not use falcon set `before_script: []`.
  - project: 'catalyst/falcon-mobile-pipeline'
    ref: main
    file: 'stages/before_script.yml'
    rules: &desktop-include-rules
      - if: '$CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api" || $CI_PIPELINE_SOURCE == "trigger" || $CI_COMMIT_TAG =~ /^desktop-v\d+\.\d+\.\d+$/'
  - local: '.gitlab-ci.desktop-macos.yml'
    rules: *desktop-include-rules
  - local: '.gitlab-ci.desktop-windows.yml'
    rules: *desktop-include-rules
  # Developer ID signing + notarization: release tags, or MACOS_SIGNING_ENABLED.
  # It brings its own pinned include of falcon's signing template.
  - local: '.gitlab-ci.desktop-macos-signing.yml'
    rules: *desktop-include-rules
  - local: '.gitlab-ci.desktop-release.yml'
    rules: *desktop-include-rules

variables:
  # ── Ad-hoc packaging defaults (not in the form; see the header) ──────────
  BUILD_PLATFORM: 'macos'
  BUILD_PROFILE: 'fast'
  MACOS_SIGNING_ENABLED: 'false'
  # ── Fixed falcon settings (no description: not in the form) ──────────────
  # falcon's before_script and package scripts read these; the ad-hoc job rules
  # match TASK_TYPE. Nothing here deploys or notifies through falcon.
  TASK_TYPE: 'package'
  CI_PKG_SKIP_DEPLOYMENT: '1'
  CI_BUILD_NOTIF: '0'
  # falcon branch the before_script clones (change only to test a falcon branch).
  CI_PIPELINE_REF: 'main'
  # Branch whose pipelines may create a Desktop tag, besides the default branch.
  DESKTOP_RELEASE_BRANCH: 'feat/stepcode-desktop-ci-pipeline-build'
  # The only field of the Run pipeline form. Inert by default; a bump starts
  # a release in the same pipeline (tag, build, sign, upload).
  DESKTOP_BUMP:
    value: 'none'
    options:
      - 'none'
      - 'patch'
      - 'minor'
      - 'major'
    description: 'Release StepCode Desktop: patch / minor / major creates the next desktop-vX.Y.Z tag, builds the signed macOS installers and uploads them (test bucket automatically, production on a manual click). none builds an unsigned macOS test package only.'

  # ── Release targets shared by the desktop and CLI release jobs ───────────
  # Declared here, not in .gitlab-ci.desktop-release.yml: that file is not
  # loaded for a CLI v* tag pipeline (see the include rules).
  RELEASE_BUILDER_IMAGE: 'hub.stepfun-inc.com/aiagent/step-cli/release-builder@sha256:c6538968b0f1d223b02016bf1689c35a6b26d6945fb273629ce66d1f3e36a7fc'
  STEP_RELEASE_BASE_URL: 'https://capy-public-dev.tos-cn-shanghai.volces.com/stepcode'
  STEP_RELEASE_PROD_BASE_URL: 'https://static-openapi.stepfun.com/stepcode'
  STEP_TOS_PROD_BUCKET: 'devcenter-web-cn-prod'
  STEP_TOS_PROD_ENDPOINT: 'tos-cn-shanghai.ivolces.com'

  # ── CLI/TUI release variables (ported from the default branch) ───────────
  RELEASE_BUNDLE_VERSION: "v0.3.1"
  # Internal mirror for the rg/fd search-tool binaries: this project's own GitLab
  # generic package registry. scripts/copy-search-tools.mjs fetches from here
  # (authenticating with the runner's CI_JOB_TOKEN) so the release archive bundles
  # rg/fd without reaching github.com. Falls back to GitHub if unset/unreachable.
  STEP_TOOLS_BASE_URL: "https://gitlab.basemind.com/api/v4/projects/10933/packages/generic/search-tools/1.0.0"
  # Local artifactory repo that receives @stepfun/stepcode (see release_npm_publish).
  # The virtual npm-public repo has no default deployment repo and rejects
  # publishes; it aggregates stepai-npm-release, so users install from npm-public.
  STEP_NPM_REGISTRY: "https://artifactory.stepfun-inc.com/artifactory/api/npm/stepai-npm-release/"
  STEPCODE_BUILD_COMMIT: $CI_COMMIT_SHORT_SHA
  # Test release notifications use the same built-in token as stepcli-bot when
  # ENV_NAME=test. Both values may be overridden by masked CI variables for
  # other environments or during token rotation.
  STEP_RELEASE_BOT_WEBHOOK_URL: "https://test-openapi-stepcli-bot.c.stepfun-inc.net/webhooks/step-harness/release"
  STEP_RELEASE_BOT_WEBHOOK_TOKEN: "EprwvGGOL6hOSkpROGZZOOhg9H0ghnw8IJVmNsMcieh+oazfgy9Ey0X0wo/CDYBz"
  # The default is intentionally inert. A real bump is selected explicitly in
  # GitLab's Run pipeline form on the default branch.
  BUMP:
    value: "none"
    options:
      - "none"
      - "patch"
      - "minor"
      - "major"
    description: "Select a release bump for the default branch; leave none for a normal pipeline."

# falcon's before_script.yml declares package/upload/test/publish; the release
# and notarization topology add their own, and the last declaration wins. The
# lint stage and the CLI release stages come from the default branch.
stages:
  - lint
  - verify
  - test
  - tag
  - package
  - macos-checkpoint
  - macos-notary-submit
  - macos-notary-finalize
  - upload
  - publish
  - notify

# ── CLI/TUI jobs (ported from the default branch) ─────────────────────────
# Docker jobs: no falcon toolchain, so the global falcon before_script is off.
.cli-docker-job:
  tags:
    - docker
  before_script: []
  interruptible: true

# The pinned release-builder digest predates the Dockerfile change that added
# git (and the search tools used by the coding-agent). Keep this short-lived
# bootstrap while the image is rebuilt and repinned; it is a no-op once the
# image contains the dependencies.
.release_builder_dependencies:
  variables:
    RELEASE_BUILDER_GIT: "false"
    RELEASE_BUILDER_SEARCH_TOOLS: "false"
  before_script:
    - |
      packages=""
      if [ "${RELEASE_BUILDER_GIT:-false}" = "true" ] && ! command -v git >/dev/null 2>&1; then
        packages="$packages git"
      fi
      if [ "${RELEASE_BUILDER_SEARCH_TOOLS:-false}" = "true" ]; then
        if ! command -v fd >/dev/null 2>&1 && ! command -v fdfind >/dev/null 2>&1; then
          packages="$packages fd-find"
        fi
        if ! command -v rg >/dev/null 2>&1; then
          packages="$packages ripgrep"
        fi
      fi
      if [ -n "$packages" ]; then
        echo "Installing missing release-builder dependencies:$packages" >&2
        if ! { apt-get update -qq && apt-get install -y -qq --no-install-recommends $packages; }; then
          echo "Could not install release-builder dependencies:$packages." >&2
          echo "Rebuild infra/release/release-builder, publish the image, and update RELEASE_BUILDER_IMAGE." >&2
          exit 1
        fi
      fi
    - |
      if [ "${RELEASE_BUILDER_GIT:-false}" = "true" ]; then
        git --version
      fi

# The ported CLI/TUI jobs keep the default branch's job definitions but not its
# workflow: a branch push or merge request here starts no pipeline, and a
# desktop-v* release pipeline must not wait on CLI lint/test. They therefore run
# on a CLI release tag (vX.Y.Z), or on a manual/api pipeline that sets
# STEP_RUN_CLI_JOBS=true to validate the CLI against this branch.
.cli-check-rules:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
    - if: '$STEP_RUN_CLI_JOBS == "true" && ($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api" || $CI_PIPELINE_SOURCE == "trigger")'
    - when: never

lint:
  stage: lint
  image: "$RELEASE_BUILDER_IMAGE"
  extends:
    - .cli-docker-job
    - .release_builder_dependencies
    - .cli-check-rules
  script:
    - pnpm install --frozen-lockfile --ignore-scripts
    - pnpm run hydrate:model-data
    - pnpm run check
  cache:
    key: "npm-$CI_COMMIT_REF_SLUG"
    paths:
      - node_modules/
      - .npm/
    policy: pull-push

test:
  stage: test
  image: "$RELEASE_BUILDER_IMAGE"
  extends:
    - .cli-docker-job
    - .release_builder_dependencies
    - .cli-check-rules
  variables:
    RELEASE_BUILDER_GIT: "true"
    RELEASE_BUILDER_SEARCH_TOOLS: "true"
  script:
    - pnpm install --frozen-lockfile --ignore-scripts
    - pnpm run hydrate:model-data
    # Workspace packages expose their dist entrypoints through package.json.
    # Build them before Vitest starts child processes that import those entrypoints.
    - pnpm run build:offline
    - pnpm test
  cache:
    key: "npm-$CI_COMMIT_REF_SLUG"
    paths:
      - node_modules/
      - .npm/
    policy: pull
  coverage: '/All files[^|]*\|[^|]*\s+([\d\.]+)/'

# Keep native smoke tests opt-in until matching GitLab runners are provisioned.
# A permanently pending job would block every merge request.
.native_test:
  extends: .cli-docker-job
  stage: test
  rules:
    - if: '$STEP_ENABLE_NATIVE_RUNNERS != "true"'
      when: never
    - !reference [.cli-check-rules, rules]
  script:
    - pnpm install --frozen-lockfile --ignore-scripts
    - pnpm run hydrate:model-data
    - pnpm run build:offline
    - pnpm test

test:windows:
  extends: .native_test
  tags:
    - windows

test:macos:
  extends: .native_test
  tags:
    - macos

tag_release:
  stage: tag
  image: "$RELEASE_BUILDER_IMAGE"
  extends:
    - .cli-docker-job
    - .release_builder_dependencies
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    - if: '$BUMP != "none" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: on_success
    - when: never
  script:
    - |
      if [ -z "${STEP_RELEASE_TOKEN:-}" ]; then
        echo "STEP_RELEASE_TOKEN is not set." >&2
        echo "Add a masked project access token with the api scope." >&2
        exit 1
      fi
    - node infra/release/tag-release.mjs --bump "$BUMP"

# The ported CLI/TUI release jobs belong to the CLI's own vX.Y.Z tags only. A
# desktop-v* tag also sets CI_COMMIT_TAG, so matching on it alone would offer
# CLI bundle uploads that read the desktop version.
.cli-tag-rules:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
      when: manual
    - when: never

# Build all six platform archives, generate latest.json/manifest.json and
# upload the bundle plus installers to the configured TOS bucket. This remains
# manual on tag pipelines so a tag can be validated before publication.
release_bundle_upload:
  stage: package
  image: "$RELEASE_BUILDER_IMAGE"
  extends:
    - .cli-docker-job
    - .release_builder_dependencies
    - .cli-tag-rules
  needs:
    - job: lint
    - job: test
  script:
    - export STEP_RELEASE_VERSION="${CI_COMMIT_TAG:-$RELEASE_BUNDLE_VERSION}"
    - pnpm install --frozen-lockfile --ignore-scripts
    - pnpm run hydrate:model-data
    - node infra/release/release-bundle.mjs --version "$STEP_RELEASE_VERSION" --base-url "$STEP_RELEASE_BASE_URL" --upload
    - |
      base="${STEP_RELEASE_BASE_URL%/}"
      version="${STEP_RELEASE_VERSION#v}"
      cat > dist/release/publish.env <<EOF
      STEP_RELEASE_VERSION=$version
      STEP_RELEASE_TAG=${CI_COMMIT_TAG:-v$version}
      STEP_RELEASE_NAME=stepcode ${CI_COMMIT_TAG:-v$version}
      STEP_RELEASE_INSTALL_URL=$base/install.sh
      STEP_RELEASE_INSTALL_PS1_URL=$base/install.ps1
      STEP_RELEASE_LATEST_URL=$base/latest.json
      STEP_RELEASE_MANIFEST_URL=$base/$version/manifest.json
      STEP_RELEASE_DARWIN_ARM64_URL=$base/$version/step-$version-darwin-arm64.tar.gz
      STEP_RELEASE_DARWIN_X64_URL=$base/$version/step-$version-darwin-x64.tar.gz
      STEP_RELEASE_LINUX_ARM64_URL=$base/$version/step-$version-linux-arm64.tar.gz
      STEP_RELEASE_LINUX_X64_URL=$base/$version/step-$version-linux-x64.tar.gz
      STEP_RELEASE_WINDOWS_ARM64_URL=$base/$version/step-$version-windows-arm64.zip
      STEP_RELEASE_WINDOWS_X64_URL=$base/$version/step-$version-windows-x64.zip
      EOF
  artifacts:
    reports:
      dotenv: dist/release/publish.env
    paths:
      - dist/release/
    expire_in: 7 days

# Production uses the same byte-identical bundle and only changes the TOS
# destination and public base URL. Credentials are masked project variables.
release_bundle_upload_prod:
  stage: package
  image: "$RELEASE_BUILDER_IMAGE"
  extends:
    - .cli-docker-job
    - .release_builder_dependencies
    - .cli-tag-rules
  needs:
    - job: lint
    - job: test
  script:
    - |
      if [ -z "${STEP_TOS_PROD_ACCESS_KEY:-}" ] || [ -z "${STEP_TOS_PROD_SECRET_KEY:-}" ]; then
        echo "STEP_TOS_PROD_ACCESS_KEY and STEP_TOS_PROD_SECRET_KEY are required." >&2
        exit 1
      fi
    - export STEP_RELEASE_VERSION="${CI_COMMIT_TAG:-$RELEASE_BUNDLE_VERSION}"
    - export STEP_TOS_BUCKET="$STEP_TOS_PROD_BUCKET"
    - export STEP_TOS_ENDPOINT="$STEP_TOS_PROD_ENDPOINT"
    - export STEP_TOS_ACCESS_KEY="$STEP_TOS_PROD_ACCESS_KEY"
    - export STEP_TOS_SECRET_KEY="$STEP_TOS_PROD_SECRET_KEY"
    - pnpm install --frozen-lockfile --ignore-scripts
    - pnpm run hydrate:model-data
    - node infra/release/release-bundle.mjs --version "$STEP_RELEASE_VERSION" --base-url "$STEP_RELEASE_PROD_BASE_URL" --upload
    - |
      base="${STEP_RELEASE_PROD_BASE_URL%/}"
      version="${STEP_RELEASE_VERSION#v}"
      cat > dist/release/publish.env <<EOF
      STEP_RELEASE_VERSION=$version
      STEP_RELEASE_TAG=${CI_COMMIT_TAG:-v$version}
      STEP_RELEASE_NAME=stepcode ${CI_COMMIT_TAG:-v$version}
      STEP_RELEASE_INSTALL_URL=$base/install.sh
      STEP_RELEASE_INSTALL_PS1_URL=$base/install.ps1
      STEP_RELEASE_LATEST_URL=$base/latest.json
      STEP_RELEASE_MANIFEST_URL=$base/$version/manifest.json
      STEP_RELEASE_DARWIN_ARM64_URL=$base/$version/step-$version-darwin-arm64.tar.gz
      STEP_RELEASE_DARWIN_X64_URL=$base/$version/step-$version-darwin-x64.tar.gz
      STEP_RELEASE_LINUX_ARM64_URL=$base/$version/step-$version-linux-arm64.tar.gz
      STEP_RELEASE_LINUX_X64_URL=$base/$version/step-$version-linux-x64.tar.gz
      STEP_RELEASE_WINDOWS_ARM64_URL=$base/$version/step-$version-windows-arm64.zip
      STEP_RELEASE_WINDOWS_X64_URL=$base/$version/step-$version-windows-x64.zip
      EOF
  artifacts:
    reports:
      dotenv: dist/release/publish.env
    expire_in: 7 days

publish_release:
  stage: publish
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  extends:
    - .cli-docker-job
    - .cli-tag-rules
  needs:
    - job: release_bundle_upload_prod
      artifacts: true
  script:
    - echo "Publishing StepCode release $STEP_RELEASE_TAG"
  release:
    tag_name: "$STEP_RELEASE_TAG"
    ref: "$CI_COMMIT_SHA"
    name: "$STEP_RELEASE_NAME"
    description: |
      StepCode release artifacts uploaded to the public object store.

      Install:
      - $STEP_RELEASE_INSTALL_URL
      - $STEP_RELEASE_INSTALL_PS1_URL

      Metadata:
      - $STEP_RELEASE_LATEST_URL
      - $STEP_RELEASE_MANIFEST_URL
    assets:
      links:
        - name: install.sh
          url: "$STEP_RELEASE_INSTALL_URL"
        - name: install.ps1
          url: "$STEP_RELEASE_INSTALL_PS1_URL"
        - name: latest.json
          url: "$STEP_RELEASE_LATEST_URL"
        - name: manifest.json
          url: "$STEP_RELEASE_MANIFEST_URL"
        - name: step-darwin-arm64.tar.gz
          url: "$STEP_RELEASE_DARWIN_ARM64_URL"
        - name: step-darwin-x64.tar.gz
          url: "$STEP_RELEASE_DARWIN_X64_URL"
        - name: step-linux-arm64.tar.gz
          url: "$STEP_RELEASE_LINUX_ARM64_URL"
        - name: step-linux-x64.tar.gz
          url: "$STEP_RELEASE_LINUX_X64_URL"
        - name: step-windows-arm64.zip
          url: "$STEP_RELEASE_WINDOWS_ARM64_URL"
        - name: step-windows-x64.zip
          url: "$STEP_RELEASE_WINDOWS_X64_URL"

# Publish @stepfun/stepcode and its six platform packages to the internal npm
# registry. Repackages the exact archives on the prod CDN (checksums verified
# against manifest.json), so npm and install.sh ship identical binaries.
# Already-published versions are skipped, so a failed job can be retried.
# NPM_TOKEN is a masked registry token with deploy rights on STEP_NPM_REGISTRY.
.release_npm_publish:
  extends: .cli-docker-job
  stage: publish
  image: "$RELEASE_BUILDER_IMAGE"
  script:
    - |
      if [ -z "${NPM_TOKEN:-}" ]; then
        echo "NPM_TOKEN is not set." >&2
        echo "Add a masked npm token with deploy rights on $STEP_NPM_REGISTRY." >&2
        exit 1
      fi
    - node infra/release/npm-packages.mjs --version "$STEP_NPM_PUBLISH_VERSION" --base-url "$STEP_RELEASE_PROD_BASE_URL" --registry "$STEP_NPM_REGISTRY" --publish

# Runs automatically once the prod upload of a release tag succeeds.
release_npm_publish:
  extends: .release_npm_publish
  needs:
    - job: release_bundle_upload_prod
      artifacts: true
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
      when: on_success
    - when: never
  variables:
    STEP_NPM_PUBLISH_VERSION: "$CI_COMMIT_TAG"

# Backfill: publish an already-released version from any branch pipeline by
# setting STEP_NPM_PUBLISH_VERSION (e.g. v0.1.2) in the Run pipeline form. Only
# reads the prod CDN; never rebuilds or touches TOS.
release_npm_backfill:
  extends: .release_npm_publish
  needs: []
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    - if: '$STEP_NPM_PUBLISH_VERSION'
      when: on_success
    - when: never

# GitLab evaluates a job's `release:` block after its script succeeds. Keeping
# this webhook in a dependent job guarantees both publish_release and the
# GitLab Release creation completed before the bot starts writing the Wiki page.
notify_release:
  stage: notify
  image: "$RELEASE_BUILDER_IMAGE"
  extends:
    - .cli-docker-job
    - .cli-tag-rules
  needs:
    - job: publish_release
      artifacts: false
  script:
    - |
      node --input-type=module <<'NODE'
      const requiredEnv = [
        "STEP_RELEASE_BOT_WEBHOOK_URL",
        "STEP_RELEASE_BOT_WEBHOOK_TOKEN",
        "CI_COMMIT_TAG",
        "CI_COMMIT_SHA",
        "CI_PIPELINE_URL",
        "CI_PROJECT_URL",
        "CI_PROJECT_PATH",
      ];
      const missing = requiredEnv.filter((name) => !process.env[name]?.trim());
      if (missing.length > 0) {
        throw new Error(`Missing required release notification variables: ${missing.join(", ")}`);
      }

      let webhookURL;
      try {
        webhookURL = new URL(process.env.STEP_RELEASE_BOT_WEBHOOK_URL);
      } catch {
        throw new Error("STEP_RELEASE_BOT_WEBHOOK_URL must be a valid absolute URL");
      }
      if (
        webhookURL.protocol !== "https:" ||
        webhookURL.username ||
        webhookURL.password ||
        webhookURL.search ||
        webhookURL.hash
      ) {
        throw new Error("STEP_RELEASE_BOT_WEBHOOK_URL must be HTTPS without user info, query, or fragment");
      }

      const payload = {
        version: process.env.CI_COMMIT_TAG,
        commit_sha: process.env.CI_COMMIT_SHA,
        pipeline_url: process.env.CI_PIPELINE_URL,
        release_url: `${process.env.CI_PROJECT_URL}/-/releases/${process.env.CI_COMMIT_TAG}`,
        project_path: process.env.CI_PROJECT_PATH,
      };
      const response = await fetch(webhookURL, {
        method: "POST",
        headers: {
          Accept: "application/json",
          Authorization: `Bearer ${process.env.STEP_RELEASE_BOT_WEBHOOK_TOKEN}`,
          "Content-Type": "application/json",
        },
        body: JSON.stringify(payload),
        signal: AbortSignal.timeout(30_000),
      });
      const responseBody = (await response.text()).slice(0, 1000);
      if (!response.ok) {
        throw new Error(`Release notification webhook returned HTTP ${response.status}: ${responseBody}`);
      }
      let result;
      try {
        result = JSON.parse(responseBody);
      } catch {
        throw new Error("Release notification webhook returned invalid JSON");
      }
      if (result.status !== "accepted" && result.status !== "duplicate") {
        throw new Error(`Release notification webhook returned unexpected status: ${String(result.status)}`);
      }
      console.log(`Release notification accepted for ${payload.version}: ${result.status}`);
      NODE
