variables:
  # The release builder contains Node 22, pnpm, Bun, zip and the native build
  # toolchain used by scripts/build-binaries.sh. CI installs from the checked-in
  # pnpm-lock.yaml with `pnpm install --frozen-lockfile`.
  RELEASE_BUILDER_IMAGE: "hub.stepfun-inc.com/aiagent/step-cli/release-builder@sha256:c6538968b0f1d223b02016bf1689c35a6b26d6945fb273629ce66d1f3e36a7fc"
  RELEASE_BUNDLE_VERSION: "v0.3.1"
  STEP_RELEASE_BASE_URL: "https://capy-public-dev.tos-cn-shanghai.volces.com/stepcode"
  STEP_RELEASE_PROD_BASE_URL: "https://static-openapi.stepfun.com/stepcode"
  # Internal mirror for the rg/fd search-tool binaries: this project's own GitLab
  # generic package registry. scripts/copy-search-tools.mjs fetches from here
  # (authenticating with the runner's CI_JOB_TOKEN) so the release archive bundles
  # rg/fd without reaching github.com. Falls back to GitHub if unset/unreachable.
  STEP_TOOLS_BASE_URL: "https://gitlab.basemind.com/api/v4/projects/10933/packages/generic/search-tools/1.0.0"
  STEP_TOS_PROD_BUCKET: "devcenter-web-cn-prod"
  STEP_TOS_PROD_ENDPOINT: "tos-cn-shanghai.ivolces.com"
  STEPCODE_BUILD_COMMIT: $CI_COMMIT_SHORT_SHA
  # Test release notifications use the same built-in token as stepcli-bot when
  # ENV_NAME=test. Both values may be overridden by masked CI variables for
  # other environments or during token rotation.
  STEP_RELEASE_BOT_WEBHOOK_URL: "https://test-openapi-stepcli-bot.c.stepfun-inc.net/webhooks/step-harness/release"
  STEP_RELEASE_BOT_WEBHOOK_TOKEN: "EprwvGGOL6hOSkpROGZZOOhg9H0ghnw8IJVmNsMcieh+oazfgy9Ey0X0wo/CDYBz"
  # The default is intentionally inert. A real bump is selected explicitly in
  # GitLab's Run pipeline form on the default branch.
  BUMP:
    value: "none"
    options:
      - "none"
      - "patch"
      - "minor"
      - "major"
    description: "Select a release bump for the default branch; leave none for a normal pipeline."

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TITLE == "edit by devops"'
      when: never
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

default:
  interruptible: true
  tags:
    - docker

# The pinned release-builder digest predates the Dockerfile change that added
# git (and the search tools used by the coding-agent). Keep this short-lived
# bootstrap while the image is rebuilt and repinned; it is a no-op once the
# image contains the dependencies.
.release_builder_dependencies:
  variables:
    RELEASE_BUILDER_GIT: "false"
    RELEASE_BUILDER_SEARCH_TOOLS: "false"
  before_script:
    - |
      packages=""
      if [ "${RELEASE_BUILDER_GIT:-false}" = "true" ] && ! command -v git >/dev/null 2>&1; then
        packages="$packages git"
      fi
      if [ "${RELEASE_BUILDER_SEARCH_TOOLS:-false}" = "true" ]; then
        if ! command -v fd >/dev/null 2>&1 && ! command -v fdfind >/dev/null 2>&1; then
          packages="$packages fd-find"
        fi
        if ! command -v rg >/dev/null 2>&1; then
          packages="$packages ripgrep"
        fi
      fi
      if [ -n "$packages" ]; then
        echo "Installing missing release-builder dependencies:$packages" >&2
        if ! { apt-get update -qq && apt-get install -y -qq --no-install-recommends $packages; }; then
          echo "Could not install release-builder dependencies:$packages." >&2
          echo "Rebuild infra/release/release-builder, publish the image, and update RELEASE_BUILDER_IMAGE." >&2
          exit 1
        fi
      fi
    - |
      if [ "${RELEASE_BUILDER_GIT:-false}" = "true" ]; then
        git --version
      fi

stages:
  - lint
  - test
  - tag
  - package
  - publish
  - notify

lint:
  stage: lint
  image: "$RELEASE_BUILDER_IMAGE"
  extends: .release_builder_dependencies
  script:
    - pnpm install --frozen-lockfile --ignore-scripts
    - pnpm run hydrate:model-data
    - pnpm run check
  cache:
    key: "npm-$CI_COMMIT_REF_SLUG"
    paths:
      - node_modules/
      - .npm/
    policy: pull-push

test:
  stage: test
  image: "$RELEASE_BUILDER_IMAGE"
  extends: .release_builder_dependencies
  variables:
    RELEASE_BUILDER_GIT: "true"
    RELEASE_BUILDER_SEARCH_TOOLS: "true"
  script:
    - pnpm install --frozen-lockfile --ignore-scripts
    - pnpm run hydrate:model-data
    # Workspace packages expose their dist entrypoints through package.json.
    # Build them before Vitest starts child processes that import those entrypoints.
    - pnpm run build:offline
    - pnpm test
  cache:
    key: "npm-$CI_COMMIT_REF_SLUG"
    paths:
      - node_modules/
      - .npm/
    policy: pull
  coverage: '/All files[^|]*\|[^|]*\s+([\d\.]+)/'

# Keep native smoke tests opt-in until matching GitLab runners are provisioned.
# A permanently pending job would block every merge request.
.native_test:
  stage: test
  rules:
    - if: '$STEP_ENABLE_NATIVE_RUNNERS == "true"'
      when: on_success
    - when: never
  script:
    - pnpm install --frozen-lockfile --ignore-scripts
    - pnpm run hydrate:model-data
    - pnpm run build:offline
    - pnpm test

test:windows:
  extends: .native_test
  tags:
    - windows

test:macos:
  extends: .native_test
  tags:
    - macos

tag_release:
  stage: tag
  image: "$RELEASE_BUILDER_IMAGE"
  extends: .release_builder_dependencies
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    - if: '$BUMP != "none" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: on_success
    - when: never
  script:
    - |
      if [ -z "${STEP_RELEASE_TOKEN:-}" ]; then
        echo "STEP_RELEASE_TOKEN is not set." >&2
        echo "Add a masked project access token with the api scope." >&2
        exit 1
      fi
    - node infra/release/tag-release.mjs --bump "$BUMP"

# Build all six platform archives, generate latest.json/manifest.json and
# upload the bundle plus installers to the configured TOS bucket. This remains
# manual on tag pipelines so a tag can be validated before publication.
release_bundle_upload:
  stage: package
  image: "$RELEASE_BUILDER_IMAGE"
  extends: .release_builder_dependencies
  needs:
    - job: lint
    - job: test
  rules:
    - if: '$CI_COMMIT_TAG'
      when: manual
    - when: never
  script:
    - export STEP_RELEASE_VERSION="${CI_COMMIT_TAG:-$RELEASE_BUNDLE_VERSION}"
    - pnpm install --frozen-lockfile --ignore-scripts
    - pnpm run hydrate:model-data
    - node infra/release/release-bundle.mjs --version "$STEP_RELEASE_VERSION" --base-url "$STEP_RELEASE_BASE_URL" --upload
    - |
      base="${STEP_RELEASE_BASE_URL%/}"
      version="${STEP_RELEASE_VERSION#v}"
      cat > dist/release/publish.env <<EOF
      STEP_RELEASE_VERSION=$version
      STEP_RELEASE_TAG=${CI_COMMIT_TAG:-v$version}
      STEP_RELEASE_NAME=stepcode ${CI_COMMIT_TAG:-v$version}
      STEP_RELEASE_INSTALL_URL=$base/install.sh
      STEP_RELEASE_INSTALL_PS1_URL=$base/install.ps1
      STEP_RELEASE_LATEST_URL=$base/latest.json
      STEP_RELEASE_MANIFEST_URL=$base/$version/manifest.json
      STEP_RELEASE_DARWIN_ARM64_URL=$base/$version/step-$version-darwin-arm64.tar.gz
      STEP_RELEASE_DARWIN_X64_URL=$base/$version/step-$version-darwin-x64.tar.gz
      STEP_RELEASE_LINUX_ARM64_URL=$base/$version/step-$version-linux-arm64.tar.gz
      STEP_RELEASE_LINUX_X64_URL=$base/$version/step-$version-linux-x64.tar.gz
      STEP_RELEASE_WINDOWS_ARM64_URL=$base/$version/step-$version-windows-arm64.zip
      STEP_RELEASE_WINDOWS_X64_URL=$base/$version/step-$version-windows-x64.zip
      EOF
  artifacts:
    reports:
      dotenv: dist/release/publish.env
    paths:
      - dist/release/
    expire_in: 7 days

# Production uses the same byte-identical bundle and only changes the TOS
# destination and public base URL. Credentials are masked project variables.
release_bundle_upload_prod:
  stage: package
  image: "$RELEASE_BUILDER_IMAGE"
  extends: .release_builder_dependencies
  needs:
    - job: lint
    - job: test
  rules:
    - if: '$CI_COMMIT_TAG'
      when: manual
    - when: never
  script:
    - |
      if [ -z "${STEP_TOS_PROD_ACCESS_KEY:-}" ] || [ -z "${STEP_TOS_PROD_SECRET_KEY:-}" ]; then
        echo "STEP_TOS_PROD_ACCESS_KEY and STEP_TOS_PROD_SECRET_KEY are required." >&2
        exit 1
      fi
    - export STEP_RELEASE_VERSION="${CI_COMMIT_TAG:-$RELEASE_BUNDLE_VERSION}"
    - export STEP_TOS_BUCKET="$STEP_TOS_PROD_BUCKET"
    - export STEP_TOS_ENDPOINT="$STEP_TOS_PROD_ENDPOINT"
    - export STEP_TOS_ACCESS_KEY="$STEP_TOS_PROD_ACCESS_KEY"
    - export STEP_TOS_SECRET_KEY="$STEP_TOS_PROD_SECRET_KEY"
    - pnpm install --frozen-lockfile --ignore-scripts
    - pnpm run hydrate:model-data
    - node infra/release/release-bundle.mjs --version "$STEP_RELEASE_VERSION" --base-url "$STEP_RELEASE_PROD_BASE_URL" --upload
    - |
      base="${STEP_RELEASE_PROD_BASE_URL%/}"
      version="${STEP_RELEASE_VERSION#v}"
      cat > dist/release/publish.env <<EOF
      STEP_RELEASE_VERSION=$version
      STEP_RELEASE_TAG=${CI_COMMIT_TAG:-v$version}
      STEP_RELEASE_NAME=stepcode ${CI_COMMIT_TAG:-v$version}
      STEP_RELEASE_INSTALL_URL=$base/install.sh
      STEP_RELEASE_INSTALL_PS1_URL=$base/install.ps1
      STEP_RELEASE_LATEST_URL=$base/latest.json
      STEP_RELEASE_MANIFEST_URL=$base/$version/manifest.json
      STEP_RELEASE_DARWIN_ARM64_URL=$base/$version/step-$version-darwin-arm64.tar.gz
      STEP_RELEASE_DARWIN_X64_URL=$base/$version/step-$version-darwin-x64.tar.gz
      STEP_RELEASE_LINUX_ARM64_URL=$base/$version/step-$version-linux-arm64.tar.gz
      STEP_RELEASE_LINUX_X64_URL=$base/$version/step-$version-linux-x64.tar.gz
      STEP_RELEASE_WINDOWS_ARM64_URL=$base/$version/step-$version-windows-arm64.zip
      STEP_RELEASE_WINDOWS_X64_URL=$base/$version/step-$version-windows-x64.zip
      EOF
  artifacts:
    reports:
      dotenv: dist/release/publish.env
    expire_in: 7 days

publish_release:
  stage: publish
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: release_bundle_upload_prod
      artifacts: true
  rules:
    - if: '$CI_COMMIT_TAG'
      when: manual
    - when: never
  script:
    - echo "Publishing StepCode release $STEP_RELEASE_TAG"
  release:
    tag_name: "$STEP_RELEASE_TAG"
    ref: "$CI_COMMIT_SHA"
    name: "$STEP_RELEASE_NAME"
    description: |
      StepCode release artifacts uploaded to the public object store.

      Install:
      - $STEP_RELEASE_INSTALL_URL
      - $STEP_RELEASE_INSTALL_PS1_URL

      Metadata:
      - $STEP_RELEASE_LATEST_URL
      - $STEP_RELEASE_MANIFEST_URL
    assets:
      links:
        - name: install.sh
          url: "$STEP_RELEASE_INSTALL_URL"
        - name: install.ps1
          url: "$STEP_RELEASE_INSTALL_PS1_URL"
        - name: latest.json
          url: "$STEP_RELEASE_LATEST_URL"
        - name: manifest.json
          url: "$STEP_RELEASE_MANIFEST_URL"
        - name: step-darwin-arm64.tar.gz
          url: "$STEP_RELEASE_DARWIN_ARM64_URL"
        - name: step-darwin-x64.tar.gz
          url: "$STEP_RELEASE_DARWIN_X64_URL"
        - name: step-linux-arm64.tar.gz
          url: "$STEP_RELEASE_LINUX_ARM64_URL"
        - name: step-linux-x64.tar.gz
          url: "$STEP_RELEASE_LINUX_X64_URL"
        - name: step-windows-arm64.zip
          url: "$STEP_RELEASE_WINDOWS_ARM64_URL"
        - name: step-windows-x64.zip
          url: "$STEP_RELEASE_WINDOWS_X64_URL"

# GitLab evaluates a job's `release:` block after its script succeeds. Keeping
# this webhook in a dependent job guarantees both publish_release and the
# GitLab Release creation completed before the bot starts writing the Wiki page.
notify_release:
  stage: notify
  image: "$RELEASE_BUILDER_IMAGE"
  needs:
    - job: publish_release
      artifacts: false
  rules:
    - if: '$CI_COMMIT_TAG'
      when: on_success
    - when: never
  script:
    - |
      node --input-type=module <<'NODE'
      const requiredEnv = [
        "STEP_RELEASE_BOT_WEBHOOK_URL",
        "STEP_RELEASE_BOT_WEBHOOK_TOKEN",
        "CI_COMMIT_TAG",
        "CI_COMMIT_SHA",
        "CI_PIPELINE_URL",
        "CI_PROJECT_URL",
        "CI_PROJECT_PATH",
      ];
      const missing = requiredEnv.filter((name) => !process.env[name]?.trim());
      if (missing.length > 0) {
        throw new Error(`Missing required release notification variables: ${missing.join(", ")}`);
      }

      let webhookURL;
      try {
        webhookURL = new URL(process.env.STEP_RELEASE_BOT_WEBHOOK_URL);
      } catch {
        throw new Error("STEP_RELEASE_BOT_WEBHOOK_URL must be a valid absolute URL");
      }
      if (
        webhookURL.protocol !== "https:" ||
        webhookURL.username ||
        webhookURL.password ||
        webhookURL.search ||
        webhookURL.hash
      ) {
        throw new Error("STEP_RELEASE_BOT_WEBHOOK_URL must be HTTPS without user info, query, or fragment");
      }

      const payload = {
        version: process.env.CI_COMMIT_TAG,
        commit_sha: process.env.CI_COMMIT_SHA,
        pipeline_url: process.env.CI_PIPELINE_URL,
        release_url: `${process.env.CI_PROJECT_URL}/-/releases/${process.env.CI_COMMIT_TAG}`,
        project_path: process.env.CI_PROJECT_PATH,
      };
      const response = await fetch(webhookURL, {
        method: "POST",
        headers: {
          Accept: "application/json",
          Authorization: `Bearer ${process.env.STEP_RELEASE_BOT_WEBHOOK_TOKEN}`,
          "Content-Type": "application/json",
        },
        body: JSON.stringify(payload),
        signal: AbortSignal.timeout(30_000),
      });
      const responseBody = (await response.text()).slice(0, 1000);
      if (!response.ok) {
        throw new Error(`Release notification webhook returned HTTP ${response.status}: ${responseBody}`);
      }
      let result;
      try {
        result = JSON.parse(responseBody);
      } catch {
        throw new Error("Release notification webhook returned invalid JSON");
      }
      if (result.status !== "accepted" && result.status !== "duplicate") {
        throw new Error(`Release notification webhook returned unexpected status: ${String(result.status)}`);
      }
      console.log(`Release notification accepted for ${payload.version}: ${result.status}`);
      NODE
