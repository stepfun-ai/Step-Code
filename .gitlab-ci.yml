stages:
  - .pre

# Only the internal mirror branch may be promoted to main. Main-side
# observability is added by a direct commit and does not use this MR gate.
enforce-merge-order:
  stage: .pre
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"'
  script:
    - |
      if [ "$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME" != "github-opensource" ]; then
        echo "Only github-opensource may be merged into main."
        exit 1
      fi
