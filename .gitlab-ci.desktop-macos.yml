# macOS installers for StepCode Desktop: `pnpm dist:mac`, one dmg per arch.
#
# scripts/package-mac-ci.mjs builds the monorepo, packs with electron-builder and
# leaves the dmgs in dist-electron/ with the architecture in the file name, which
# is what falcon's collect_artifacts() looks for. It then copies them into
# build/ci/ with falcon's <name>-<version>_<build>-macos-<arch>.dmg shape and
# writes CI_ELECTRON_DMG_*_PATH into build/ci/build_internal.env.
#
# This job is the unsigned build (macOS gets an ad-hoc signature, no
# notarization). falcon's configure_desktop_profile maps the profile:
#   fast → FAST_BUILD=1, SKIP_NOTARIZE=1, arch=arm64
#   qa   → SKIP_NOTARIZE=1, arch=all (arm64 + x64)
# The Developer ID signed and notarized build is .gitlab-ci.desktop-macos-signing.yml:
# release tags always use it, and MACOS_SIGNING_ENABLED=true selects it for a
# Run pipeline, in which case this job steps aside.
#
# ELECTRON_MIRROR / ELECTRON_BUILDER_BINARIES_MIRROR: electron-builder downloads
# the Electron zip and its nsis/dmg helper bundles itself, over github.com by
# default. The mirrors keep the mac runner off github.
stepcode-desktop-package:
  stage: package
  image: 'hub.i.basemind.com/fe/mobile/sequoia-xcode-26.0.1:latest'
  tags:
    - mobile
    - online
    - macos
    - tart
  needs: []
  timeout: 90 minutes
  # The packaged app is a 170MB dmg and the build takes tens of minutes; a
  # cancelled job would leave the workspace half-built for the next one.
  interruptible: false
  variables:
    # No submodules in this repo, and falcon's git/gem/npm preparation is
    # replaced by the explicit pnpm install below (dist:mac does not need gems,
    # and falcon's npm preparation runs a second install).
    CI_NEEDS_GIT_PREP: '0'
    CI_NEEDS_GEM_PREP: '0'
    CI_NEEDS_NPM_PREP: '0'
    ELECTRON_MIRROR: 'https://npmmirror.com/mirrors/electron/'
    ELECTRON_BUILDER_BINARIES_MIRROR: 'https://npmmirror.com/mirrors/electron-builder-binaries/'
  rules:
    # A signed run (MACOS_SIGNING_ENABLED) and a release-tag run (DESKTOP_BUMP)
    # are other pipelines' jobs; tag pipelines never match the source check.
    - if: '$MACOS_SIGNING_ENABLED == "true" || $DESKTOP_BUMP != "none"'
      when: never
    - if: '$TASK_TYPE == "package" && ($BUILD_PLATFORM == "macos" || $BUILD_PLATFORM == "electron") && ($BUILD_PROFILE == "fast" || $BUILD_PROFILE == "qa") && ($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api" || $CI_PIPELINE_SOURCE == "trigger")'
      when: always
    - when: never
  script:
    - !reference [.scripts, initial-env]
    - corepack enable
    - corepack prepare --activate pnpm@9.15.9
    - bash "${BUILD_SCRIPT_DIR}/common/run_pnpm.sh" install --frozen-lockfile
    # The falcon toolchain is cloned into <workspace>/pipeline, inside this repo, so
    # Node resolves our root package.json's "type": "module" for falcon's CommonJS
    # helpers and `node pipeline/scripts/electron/extract_builder_info.js` dies with
    # "require is not defined in ES module scope". That helper names the collected
    # installer, so the artifact came out as "-arm64." with no extension. A
    # package.json without "type" marks the clone as CommonJS again.
    - |
      printf '{"type": "commonjs"}\n' > "${PIPELINE_TOOLCHAIN_DIR}/package.json"
    # bash -c: the tart runner's shell is zsh, and falcon's on_exit uses bash-only
    # ${!var} indirect expansion ("bad substitution"). stepfun-desktop wraps the
    # same calls the same way. Sourcing does not run electron_build.sh's main(),
    # which would repeat the install, run proto codegen this repo does not have,
    # and rewrite an electron-builder config this repo does not use.
    - |
      bash -c '
        set -eo pipefail
        source "${BUILD_SCRIPT_DIR}/package/electron_build.sh"
        build_electron_pkg   # profile -> --env/--arch/--fast-build/--notarize, then `npm run dist:mac -- ...`
        collect_artifacts    # dmg/zip into build/ci, renamed with the arch
        on_exit              # CI_ELECTRON_*_PATH into build_internal.env
      '
    # Mount the installer that was just collected and start the packaged app
    # hidden. Without this, a green job only says electron-builder finished: a
    # bundle that cannot start, or one whose server tree was staged wrong, is
    # still green here and broken on a user's machine. The smoke prints
    # STEPCODE_DESKTOP_SMOKE {json} (bridge, auth, /healthz) and exits 0/1.
    #
    # Only the host architecture is started: an x64 bundle needs Rosetta, which
    # the runner image does not promise. qa still ships both dmgs; the second one
    # is covered by the same packaging code path.
    - |
      bash -c '
        set -eo pipefail
        arch="$(uname -m)"
        if [[ "${arch}" == "x86_64" ]]; then arch=x64; fi
        image="$(ls "${CI_BUILD_ARTIFACTS_DIR}"/*-"${arch}".dmg 2>/dev/null | head -1 || true)"
        if [[ -z "${image}" ]]; then
          image="$(ls "${CI_BUILD_ARTIFACTS_DIR}"/*.dmg | head -1)"
        fi
        echo "smoke: ${image}"
        mountpoint="${CI_PROJECT_DIR}/.smoke-mount"
        mkdir -p "${mountpoint}"
        cleanup() { hdiutil detach "${mountpoint}" >/dev/null 2>&1 || true; }
        trap cleanup EXIT
        hdiutil attach "${image}" -nobrowse -readonly -mountpoint "${mountpoint}" >/dev/null
        app="$(ls -d "${mountpoint}"/*.app | head -1)"
        binary="$(ls "${app}/Contents/MacOS/" | head -1)"
        STEPCODE_DESKTOP_SMOKE=1 \
        STEPCODE_DESKTOP_USER_DATA_DIR="${CI_PROJECT_DIR}/.smoke-userdata" \
          "${app}/Contents/MacOS/${binary}"
      '
  after_script:
    - !reference [.scripts, import-ci-env]
    - bash "${BUILD_SCRIPT_DIR}/package/archive_job_artifacts.sh"
  artifacts:
    name: 'stepcode-desktop-macos-$CI_PIPELINE_IID'
    paths:
      - build_archive/
      - build/ci/ci.env
      - build/ci/build_internal.env
      # Ad-hoc builds are not uploaded anywhere, so the installer has to be a
      # job artifact. dist-electron keeps electron-builder's own name, so a bad
      # rename on falcon's side cannot lose the dmg entirely.
      - dist-electron/*.dmg
      - dist-electron/*.zip
      - build/ci/*.dmg
    expire_in: 2 weeks
    when: always
