<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1024 1024">
	<!-- The mark as a circle, laid out on the macOS icon grid: an 824px disc
	     centred in 1024px so the dock sizes it like every other app. The white
	     disc fills the black asset's cut-outs; outside the circle is empty.
	     Source of truth for icons.mjs (icon.png / icon.icns / icon.ico). -->
	<circle cx="512" cy="512" r="412" fill="#ffffff" />
	<image x="100" y="100" width="824" height="824" xlink:href="data:image/png;base64," />
</svg>
