openapi: 3.1.0
info:
  title: StepCode Web Host
  version: 0.1.0
  description: Loopback-only browser host for the StepCode AgentSessionRuntime.
servers:
  - url: http://127.0.0.1:3077
paths:
  /api/v1/migrations/scan:
    post:
      security: [{ HostCookie: [] }]
      description: >-
        Offline discovery of sessions, skills, MCP and rules on the Host. No Step account or model
        required. Inherits Host cookie, allowed-Origin and fetch-metadata checks; loopback only.
        Source projects are explicitly selected existing canonical directories; selecting one neither registers
        nor trusts it. Scanning
        never registers or trusts them. MCP discovery parses config; this is not a metadata-only scan.
        All migration URLs reject query strings, trailing slashes and encoded path segments. JSON bodies
        are limited to 65536 bytes; unknown fields are rejected. No resource is applied by scanning.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MigrationScanRequest" }
      responses:
        "200":
          description: Candidates and per-source reports; partial resource discovery can be truncated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MigrationScanResult" }
        "400": { $ref: "#/components/responses/MigrationInvalid" }
        "401": { $ref: "#/components/responses/HostAuthorizationRequired" }
        "409": { $ref: "#/components/responses/MigrationConflict" }
        "413": { $ref: "#/components/responses/MigrationBodyTooLarge" }
        "415": { $ref: "#/components/responses/MigrationContentType" }
        "503": { $ref: "#/components/responses/MigrationUnavailable" }
  /api/v1/migrations/preview:
    post:
      security: [{ HostCookie: [] }]
      description: >-
        Retain an immutable read-only preview for 15 minutes, subject to cache limits and Host restart.
        Target scope, name, action, source/target fingerprints, rule impact and required acknowledgements
        are bound together. Changing any choice requires another preview. MCP text is redacted even
        with literal-value consent. Ordinary MCP is global only; sessions require a selected project.
        Skills copy complete SKILL.md packages, not arbitrary Markdown documents. Does not apply changes.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MigrationPreviewRequest" }
      responses:
        "200":
          description: Preview, including allowed actions, warnings and blockers
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MigrationPreview" }
        "400": { $ref: "#/components/responses/MigrationInvalid" }
        "401": { $ref: "#/components/responses/HostAuthorizationRequired" }
        "404": { $ref: "#/components/responses/MigrationNotFound" }
        "409": { $ref: "#/components/responses/MigrationConflict" }
        "413": { $ref: "#/components/responses/MigrationBodyTooLarge" }
        "415": { $ref: "#/components/responses/MigrationContentType" }
        "429": { $ref: "#/components/responses/MigrationLimit" }
        "503": { $ref: "#/components/responses/MigrationUnavailable" }
  /api/v1/migrations/plans:
    post:
      security: [{ HostCookie: [] }]
      description: >-
        Confirm 1–200 previews with every required acknowledgement; revalidate and retain an immutable
        plan/digest. No resource writes yet. Duplicate selections and overlapping targets are rejected;
        at most one non-skipped rules write per plan. Rule actions are create for a missing target or
        append/replace for an existing target, never a mutable option supplied at start.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [selections]
              properties:
                selections: { type: array, minItems: 1, maxItems: 200, items: { $ref: "#/components/schemas/MigrationSelection" } }
      responses:
        "200":
          description: Confirmed immutable plan
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MigrationPlan" }
        "400": { $ref: "#/components/responses/MigrationInvalid" }
        "401": { $ref: "#/components/responses/HostAuthorizationRequired" }
        "404": { $ref: "#/components/responses/MigrationNotFound" }
        "409": { $ref: "#/components/responses/MigrationConflict" }
        "413": { $ref: "#/components/responses/MigrationBodyTooLarge" }
        "415": { $ref: "#/components/responses/MigrationContentType" }
        "429": { $ref: "#/components/responses/MigrationLimit" }
        "503": { $ref: "#/components/responses/MigrationUnavailable" }
  /api/v1/migrations:
    get:
      security: [{ HostCookie: [] }]
      description: List durable migration jobs; unfinished previous-Host jobs are reconciled as interrupted. No query parameters.
      responses:
        "200":
          description: Persisted jobs
          content:
            application/json:
              schema:
                type: object
                required: [jobs]
                properties:
                  jobs: { type: array, items: { $ref: "#/components/schemas/MigrationJob" } }
        "400": { $ref: "#/components/responses/MigrationInvalid" }
        "401": { $ref: "#/components/responses/HostAuthorizationRequired" }
        "503": { $ref: "#/components/responses/MigrationUnavailable" }
    post:
      security: [{ HostCookie: [] }]
      description: >-
        Start only a confirmed plan using its digest and idempotency key. Revalidate before publishing;
        source/target/impact changes invalidate consent (409). One active job per migration store.
        Same key and digest return the recorded job; different digest with the same key is a 409.
        Each unit is journaled; a failed/uncertain unit stops remaining work, without automatic retry
        or rollback. Poll the job for per-item outcomes; acceptance is not completion.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MigrationStartRequest" }
      responses:
        "202":
          description: Accepted or previously recorded job
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MigrationJob" }
        "400": { $ref: "#/components/responses/MigrationInvalid" }
        "401": { $ref: "#/components/responses/HostAuthorizationRequired" }
        "404": { $ref: "#/components/responses/MigrationNotFound" }
        "409": { $ref: "#/components/responses/MigrationConflict" }
        "413": { $ref: "#/components/responses/MigrationBodyTooLarge" }
        "415": { $ref: "#/components/responses/MigrationContentType" }
        "503": { $ref: "#/components/responses/MigrationUnavailable" }
  /api/v1/migrations/{jobId}:
    parameters:
      - { $ref: "#/components/parameters/MigrationJobId" }
    get:
      security: [{ HostCookie: [] }]
      description: Read current durable job state and monotonic job revision. No query parameters.
      responses:
        "200": { $ref: "#/components/responses/MigrationJobResponse" }
        "400": { $ref: "#/components/responses/MigrationInvalid" }
        "401": { $ref: "#/components/responses/HostAuthorizationRequired" }
        "404": { $ref: "#/components/responses/MigrationNotFound" }
        "503": { $ref: "#/components/responses/MigrationUnavailable" }
  /api/v1/migrations/{jobId}/cancel:
    parameters:
      - { $ref: "#/components/parameters/MigrationJobId" }
    post:
      security: [{ HostCookie: [] }]
      description: Request stopping between items. Already published items remain; cancellation is not rollback. Poll until settled.
      requestBody:
        content:
          application/json:
            schema: { type: object, additionalProperties: false, maxProperties: 0 }
      responses:
        "200": { $ref: "#/components/responses/MigrationJobResponse" }
        "400": { $ref: "#/components/responses/MigrationInvalid" }
        "401": { $ref: "#/components/responses/HostAuthorizationRequired" }
        "404": { $ref: "#/components/responses/MigrationNotFound" }
        "413": { $ref: "#/components/responses/MigrationBodyTooLarge" }
        "415": { $ref: "#/components/responses/MigrationContentType" }
        "503": { $ref: "#/components/responses/MigrationUnavailable" }
  /api/v1/migrations/recoveries/preview:
    post:
      security: [{ HostCookie: [] }]
      description: >-
        Preview restoring the backup of an existing rules file modified by append/replace. Not a general
        job undo: skills, MCP, sessions and newly created rules have no recovery here. Target
        and backup must match journal hashes; project must be selected again after restart. Does not write.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [jobId, itemId]
              properties:
                jobId: { $ref: "#/components/schemas/MigrationId" }
                itemId: { $ref: "#/components/schemas/MigrationId" }
      responses:
        "200":
          description: Guarded recovery preview, expiring in 15 minutes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MigrationRecoveryPreview" }
        "400": { $ref: "#/components/responses/MigrationInvalid" }
        "401": { $ref: "#/components/responses/HostAuthorizationRequired" }
        "404": { $ref: "#/components/responses/MigrationNotFound" }
        "409": { $ref: "#/components/responses/MigrationConflict" }
        "413": { $ref: "#/components/responses/MigrationBodyTooLarge" }
        "415": { $ref: "#/components/responses/MigrationContentType" }
        "503": { $ref: "#/components/responses/MigrationUnavailable" }
  /api/v1/migrations/recoveries/apply:
    post:
      security: [{ HostCookie: [] }]
      description: >-
        Restore only the immutable recovery preview after rules-impact acknowledgement. Rechecks target,
        backup and effective rule impact under locks; changes return 409. Does not reload active sessions
        or revert already assembled context. External editors do not share these locks; this is guarded
        replacement, not a transactional filesystem rollback.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MigrationSelection" }
      responses:
        "200":
          description: Backup restored
          content:
            application/json:
              schema:
                type: object
                required: [restored]
                properties:
                  restored: { type: boolean, const: true }
        "400": { $ref: "#/components/responses/MigrationInvalid" }
        "401": { $ref: "#/components/responses/HostAuthorizationRequired" }
        "409": { $ref: "#/components/responses/MigrationConflict" }
        "413": { $ref: "#/components/responses/MigrationBodyTooLarge" }
        "415": { $ref: "#/components/responses/MigrationContentType" }
        "503": { $ref: "#/components/responses/MigrationUnavailable" }
  /api/v1/desktop-onboarding:
    get:
      security: [{ HostCookie: [] }]
      description: >-
        Host-owned Desktop invitation state, independent of credentials, sessions and browser storage.
        A missing file is a read-only unseen revision-zero state. No Step account is required.
      responses:
        "200": { $ref: "#/components/responses/DesktopOnboardingResponse" }
        "401": { $ref: "#/components/responses/HostAuthorizationRequired" }
        "409": { $ref: "#/components/responses/DesktopOnboardingConflict" }
        "503": { $ref: "#/components/responses/DesktopOnboardingUnavailable" }
    patch:
      security: [{ HostCookie: [] }]
      description: >-
        Persist the invitation decision with expectedRevision. completed/skipped are sticky for
        flowVersion 1 across restart, upgrade and logout. Completion does not assert all items imported.
        lastJobId is an optional durable pointer, not job authority; omission preserves the old pointer.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DesktopOnboardingPatch" }
      responses:
        "200": { $ref: "#/components/responses/DesktopOnboardingResponse" }
        "400":
          description: invalid-onboarding-data or invalid-onboarding-job-id
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DesktopOnboardingError" }
        "401": { $ref: "#/components/responses/HostAuthorizationRequired" }
        "409": { $ref: "#/components/responses/DesktopOnboardingConflict" }
        "503": { $ref: "#/components/responses/DesktopOnboardingUnavailable" }
  /api/v1/session-imports/scan:
    post:
      description: Read-only discovery on the Host machine. Archived directories and child sessions are excluded by default. Symlinks are not traversed.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              description: Scans configured default source directories only. Custom path overrides are rejected.
              properties:
                includeArchived: { type: boolean, default: false }
      responses:
        "200":
          description: Candidates with opaque IDs and per-source scan errors
          content:
            application/json:
              schema:
                type: object
                required: [existingCount, roots, candidates, errors]
                properties:
                  existingCount: { type: integer, minimum: 0, description: "Matching sessions already in the current candidate list." }
                  roots:
                    type: object
                    description: Actual resolved source directories, including empty scanned directories.
                    additionalProperties: { type: string }
                  candidates: { type: array, items: { $ref: "#/components/schemas/ImportCandidate" } }
                  errors:
                    type: array
                    items:
                      type: object
                      required: [source, message]
                      properties:
                        source: { type: string }
                        message: { type: string }
        "400": { description: Invalid input }
  /api/v1/session-imports/preview:
    post:
      description: Parse and retain an immutable read-only snapshot for 15 minutes (subject to bounded cache eviction and host restart). Does not create a session, start an agent or invoke a model.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [candidateId]
              properties:
                candidateId: { type: string }
      responses:
        "200":
          description: Snapshot fingerprint, bounded excerpt and compatibility warnings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportPreview" }
        "400": { description: Unsupported or invalid source }
        "409": { description: Candidate expired or source changed }
  /api/v1/session-imports:
    get:
      description: List persisted import jobs. Previous-host unfinished jobs are marked interrupted.
      responses:
        "200":
          description: Job history
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobs: { type: array, items: { $ref: "#/components/schemas/ImportJob" } }
    post:
      description: Import the exact retained preview snapshots, not later source changes, as new native sessions. Missing or expired previews require a new preview (409). Submitted snapshots are pinned until settlement. Identical source snapshots are skipped; newly previewed changed snapshots create new copies.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [selections]
              properties:
                selections:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: object
                    required: [candidateId, fingerprint, cwd]
                    properties:
                      candidateId: { type: string }
                      fingerprint: { type: string, pattern: "^[a-f0-9]{64}$" }
                      cwd: { type: string, description: Existing absolute destination project directory }
      responses:
        "202":
          description: Accepted job; poll the job resource for per-session results
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportJob" }
        "400": { description: Invalid selection }
  /api/v1/session-imports/{jobId}:
    parameters:
      - { name: jobId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      responses:
        "200":
          description: Current or persisted job
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportJob" }
        "404": { description: Unknown job }
    delete:
      description: Request cancellation between sessions. Already published sessions remain; poll until the job settles.
      responses:
        "200":
          description: Current job
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportJob" }
        "404": { description: Unknown job }
  /api/v1/terminals:
    get:
      description: List Host-owned terminal metadata for a known workspace. Requires the Host cookie and allowed Origin; never starts a shell.
      parameters:
        - { name: cwd, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: Terminal list
          content:
            application/json:
              schema:
                type: object
                required: [terminals, support]
                properties:
                  terminals: { type: array, items: { $ref: "#/components/schemas/TerminalInfo" } }
                  support:
                    description: Whether this Host can start shells. Rechecked on each request; the client disables creation and shows reason when unavailable.
                    type: object
                    required: [available]
                    properties:
                      available: { type: boolean }
                      reason: { type: string }
        "403": { description: Unknown workspace }
    post:
      description: Create an interactive shell in a known workspace. Maximum eight per workspace and 24 per Host, including exited tabs. Opening the inspector alone does not launch a shell.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cwd]
              properties:
                cwd: { type: string }
                cols: { type: integer, minimum: 2, maximum: 500, default: 80 }
                rows: { type: integer, minimum: 1, maximum: 300, default: 24 }
      responses:
        "201":
          description: Started terminal and initial retained output
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TerminalSnapshot" }
        "400": { description: Invalid dimensions or JSON }
        "403": { description: Unknown workspace }
        "409": { description: Terminal limit reached, or the terminal was closed during startup }
        "503": { description: Native module or shell unavailable. A failure after the helper started leaves a failed tab that must be closed. }
  /api/v1/terminals/{terminalId}:
    parameters:
      - { name: terminalId, in: path, required: true, schema: { type: string } }
    delete:
      description: Terminate the owned terminal process tree and remove its tab only after cleanup succeeds. Hiding the panel and closing an SSE connection never call this.
      responses:
        "200": { description: Terminal stopped and removed }
        "404": { description: Unknown terminal }
        "503": { description: Cleanup failed; terminal retained with failed state }
  /api/v1/terminals/{terminalId}/input:
    parameters:
      - { name: terminalId, in: path, required: true, schema: { type: string } }
    post:
      description: Write 1-65536 UTF-8 bytes of input. Includes terminal escape sequences and Ctrl+C. Input is never automatically retried; a timeout has an uncertain outcome.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data: { type: string, minLength: 1, description: At most 65536 UTF-8 bytes (not characters) }
      responses:
        "200": { description: Input accepted by the PTY helper }
        "400": { description: Invalid input }
        "404": { description: Unknown terminal }
        "409": { description: Terminal is not running }
        "429": { description: Input queue is full }
        "504": { description: Outcome unknown; do not repeat input automatically }
  /api/v1/terminals/{terminalId}/resize:
    parameters:
      - { name: terminalId, in: path, required: true, schema: { type: string } }
    post:
      description: Resize the running PTY; concurrent authorized pages share the same terminal dimensions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cols, rows]
              properties:
                cols: { type: integer, minimum: 2, maximum: 500 }
                rows: { type: integer, minimum: 1, maximum: 300 }
      responses:
        "200": { description: Dimensions applied }
        "400": { description: Invalid dimensions }
        "404": { description: Unknown terminal }
        "409": { description: Terminal is not running }
  /api/v1/terminals/{terminalId}/events:
    parameters:
      - { name: terminalId, in: path, required: true, schema: { type: string } }
    get:
      description: |
        Cookie/Origin-authenticated SSE with snapshot and closed events.
        Each snapshot contains TerminalSnapshot with chunks strictly after the
        cursor. The retained tail is bounded to 512 KiB and 2048 chunks per
        terminal; truncated marks missing earlier output. A blocked socket has
        at most one written snapshot; later output is read from the bounded
        ring when it drains. Disconnects never stop the shell.
      parameters:
        - { name: after, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200":
          description: Terminal output and lifecycle stream
          content:
            text/event-stream:
              schema: { type: string }
        "400": { description: Invalid or future cursor }
        "404": { description: Unknown terminal }
  /api/v1/voice:
    get:
      description: |
        Voice dictation availability for the composer's microphone button:
        which channel the resolved credential belongs to. The key itself never
        appears in any response. Unavailable means no credential: an
        environment key or the stored Step login.
      responses:
        "200":
          description: Availability snapshot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VoiceStatus" }
        "401": { description: Authentication required }
  /api/v1/voice/start:
    post:
      description: |
        Open the one buffering session (a second start while one runs answers
        409; one that outlived its duration limit is dropped first, so a client
        that vanished cannot lock the endpoint). Chunks are buffered until the
        stop, which transcribes the whole recording.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                sampleRate:
                  type: number
                  description: >-
                    The client's real `AudioContext.sampleRate`, used for the WAV header. A browser may refuse the
                    requested rate, and a header that disagrees with the samples corrupts the transcript. Omitted or
                    implausible values fall back to 24000.
      responses:
        "200":
          description: Session started
          content:
            application/json:
              schema:
                type: object
                required: [sessionId]
                properties:
                  sessionId: { type: string }
        "401": { description: Authentication required }
        "409": { description: A voice session is already running }
  /api/v1/voice/audio:
    post:
      description: |
        Buffer one base64 PCM16 chunk (100 ms slices, mono, at the rate the
        session was started with). At most 512 KiB decoded per chunk and 10
        minutes of audio per session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data: { type: string, description: Base64 PCM16 audio }
      responses:
        "202": { description: Chunk buffered }
        "400": { description: Malformed body }
        "401": { description: Authentication required }
        "404": { description: No active voice session }
        "413": { description: Chunk or session exceeds the size limit }
  /api/v1/voice/stop:
    post:
      description: |
        Transcribe the buffered recording with the StepFun ASR service and end
        the session. The complete text comes back in the reply; an empty
        recording (or one the service recognised nothing in) answers with an
        empty text.
      responses:
        "200":
          description: Transcript
          content:
            application/json:
              schema:
                type: object
                required: [text]
                properties:
                  text: { type: string, description: The recognised text, possibly empty }
        "401": { description: Authentication required }
        "404": { description: No active voice session }
        "502": { description: The ASR service could not be reached or failed }
  /api/v1/voice/cancel:
    post:
      description: Discard the buffered recording without transcribing.
      responses:
        "200": { description: Session discarded }
        "401": { description: Authentication required }
  /api/v1/sessions/{id}/inspector:
    get:
      description: |
        Read-only right-panel projection. Tasks come from the latest step-tasks
        custom entry on the active branch. Statistics come from getSessionStats
        (whole-session totals and kernel-estimated current context). Skill count
        is session-scoped; MCP status is explicitly process-scoped. No task
        metadata, credentials, system prompt or assembled model context is returned.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Inspector data
          content:
            application/json:
              schema:
                type: object
                required: [sessionId, tasks, stats, skillCount, mcpScope, mcp]
                properties:
                  sessionId: { type: string }
                  plan:
                    type: object
                    required: [id, title]
                    properties:
                      id: { type: string }
                      title: { type: string }
                  tasks:
                    type: array
                    items:
                      type: object
                      required: [id, subject, description, status]
                      properties:
                        id: { type: string }
                        subject: { type: string }
                        description: { type: string }
                        status: { type: string, enum: [pending, in_progress, completed] }
                  skillCount: { type: integer, minimum: 0 }
                  mcpScope: { type: string, const: process }
                  mcp:
                    type: array
                    items:
                      type: object
                      required: [name, status]
                      properties:
                        name: { type: string }
                        status: { type: string, enum: [connected, connecting, failed, disabled] }
                  stats:
                    type: object
                    required: [tokens, cost]
                    properties:
                      tokens:
                        type: object
                        required: [input, output, cacheRead, cacheWrite, total]
                        properties:
                          input: { type: number }
                          output: { type: number }
                          cacheRead: { type: number }
                          cacheWrite: { type: number }
                          total: { type: number }
                      cost: { type: number }
                      contextUsage:
                        type: object
                        required: [tokens, contextWindow, percent]
                        properties:
                          tokens: { type: [number, "null"] }
                          contextWindow: { type: number }
                          percent: { type: [number, "null"] }
        "401": { description: Authentication required }
        "500": { description: Session could not be opened }
  /healthz:
    get:
      security: []
      responses:
        "200":
          description: Host is running
  /auth/exchange:
    post:
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        "200": { description: Set signed HttpOnly cookie }
        "401": { description: Invalid or reused launch token }
  /auth/logout:
    post:
      security: []
      responses:
        "200": { description: Expire the StepCode Web authentication cookie }
        "403": { description: Origin is not allowed }
  /api/v1/bootstrap:
    get:
      responses:
        "200":
          description: Launch folder and which folder picker the page should offer
          content:
            application/json:
              schema:
                type: object
                properties:
                  cwd: { type: string, description: Launch working directory }
                  defaultCwd:
                    type: string
                    description: |
                      Where a new conversation starts when no workspace is on offer.
                      The launch folder, or the home folder when the launch folder
                      was removed from workspace navigation.
                  defaultCwdFallback:
                    type: boolean
                    description: |
                      True when `defaultCwd` is the home fallback because the launch
                      folder was removed. The page names that folder "默认项目".
                  directoryPicker: { type: string, enum: [native, browse] }
                  login: { $ref: "#/components/schemas/LoginReport" }
                  customModels:
                    type: boolean
                    description: |
                      A custom (bring-your-own-key) model from models.json is usable
                      without a Step credential. Checked offline. When true, the
                      page does not open the sign-in gate.
                  migrationAvailable:
                    type: boolean
                    description: Offline migration service initialized; local migration requires no Step account or model.
                  migrationSuggested:
                    type: boolean
                    description: >-
                      Service available, onboarding unseen, and at least one local Claude Code, Codex,
                      WorkBuddy or Qoder session (any age, archived excluded) not yet imported; existing
                      StepCode sessions and hidden workspaces do not suppress it. The client offers this first-use invitation only in Desktop; this is not
                      evidence of external candidates and does not trigger a scan or apply.
                  desktopOnboarding:
                    $ref: "#/components/schemas/DesktopOnboardingState"
                    description: Omitted if onboarding state is unavailable; explicit API reports errors.
                  version:
                    type: string
                    description: |
                      Product version of the running host build, e.g. `0.1.0`.
                      Settings shows it so a window can be identified.
                  buildTime:
                    type: string
                    format: date-time
                    description: |
                      When the installed build was produced, from the release
                      envelope staged beside the server entry. Absent for a
                      source checkout.
  /api/v1/account:
    get:
      description: |
        The signed-in account's display name and avatar, for the sidebar footer.
        Read from the account session stored beside auth.json (written by a
        Step Plan sign-in, from a terminal or from the sign-in dialog) through
        the developer center's `Dashboard/UserInfo`. Never carries a token.
        Cached by the host; a sign-in from this host invalidates it.
      responses:
        "200":
          description: Account profile, or why there is none
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountReport" }
  /api/v1/login:
    get:
      description: |
        Where the model credential comes from. Signing in writes auth.json, from
        a terminal (`step login`) or from the sign-in dialog of Web and Desktop (the routes
        below); this host reads the same file. The response carries the source,
        provider and profile — never the credential — plus the command that
        changes it.
      responses:
        "200":
          description: Credential source
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginReport" }
  /api/v1/login/methods:
    get:
      description: The four `step login` profiles, for the sign-in dialog.
      responses:
        "200":
          description: Sign-in methods
          content:
            application/json:
              schema:
                type: object
                properties:
                  methods:
                    type: array
                    items: { $ref: "#/components/schemas/LoginMethod" }
  /api/v1/login/api-key:
    post:
      description: |
        Validate a platform API key against its region (GET <base>/v1/models) and,
        only when accepted, save it to auth.json in the same shape `step login`
        writes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [profile, apiKey]
              properties:
                profile: { type: string, enum: [platform_cn, platform_oversea] }
                apiKey: { type: string }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  login: { $ref: "#/components/schemas/LoginReport" }
                  warning: { type: string, description: "Non-fatal account-session problem; the credential was saved" }
        "400": { description: "Bad input, or `code: invalid_key` when the provider rejected the key" }
        "502": { description: "`code: unavailable`: the provider could not be reached; nothing was saved" }
  /api/v1/login/browser:
    get:
      description: State of the Step Plan browser sign-in.
      responses:
        "200":
          description: Browser sign-in state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BrowserLoginState" }
    post:
      description: |
        Start the Step Plan browser sign-in (the same cloud flow as `step login`)
        and answer with the authorize URL to open. Approval is awaited in the
        background; poll GET until `completed` or `failed`. Starting again
        cancels the previous attempt.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [profile]
              properties:
                profile: { type: string, enum: [step_plan, step_plan_oversea] }
      responses:
        "200":
          description: Pending, with authUrl
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BrowserLoginState" }
        "502": { description: "The sign-in could not be started (`code: failed`)" }
    delete:
      description: Cancel the pending browser sign-in; a later approval is ignored.
      responses:
        "200": { description: Cancelled }
  /api/v1/logout:
    post:
      description: |
        Sign out of Step exactly as `step logout`: wait for in-flight page
        sign-ins to settle, stop running sessions, remove the stored `step`
        credential, the legacy copies and `step-login.json`, then drop the cached
        login and account reports. Custom `models.json` providers and their keys
        are kept; `customModels` says whether one is still usable, so the page
        stays in the app instead of reopening the sign-in gate. The page cookie
        is deliberately kept, so Desktop reloads into its sign-in gate without a
        new terminal launch link. `remainingSource: environment` means
        `STEP_API_KEY` still authorizes requests and cannot be removed by the
        host.
      responses:
        "200":
          description: Sign-out report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StepLogoutReport" }
  /api/v1/workspaces:
    get:
      responses:
        "200": { description: "Workspace navigation entries (workspaces: path, name, available, optional hidden=true for explicitly removed folders) plus defaultCwd and defaultCwdFallback, which report the folder a new conversation uses when no workspace is on offer. Hidden entries persist across reload; chats remain searchable and appear under Recent. Adding the folder clears hidden." }
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path: { type: string, description: Absolute folder path }
      responses:
        "201": { description: Workspace registered by its real path }
        "400": { description: Path is missing, does not exist, or is not a directory }
    delete:
      parameters:
        - { name: path, in: query, required: true, schema: { type: string } }
      responses:
        "200": { description: Workspace hidden persistently, including session-derived folders; idempotent for retries. Files and sessions untouched. }
        "404": { description: Path is missing or not absolute }
  /api/v1/uploads:
    post:
      description: |
        Store a file the composer received by paste or drop. Browsers expose a
        pasted file's bytes and name but not its original path, so the Host
        keeps a copy at `<os tmpdir>/stepcode-web-uploads/<id>/<name>` and does
        not delete it. `id` is the SHA-256 of the stored name and the bytes, so
        pasting the same file again reuses its copy and returns the same id. A
        message names the upload by `id` in its `files` list.
      parameters:
        - { name: name, in: query, required: true, schema: { type: string }, description: Original file name; reduced to a safe last path segment }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary, description: "The raw file bytes, at most 50 MiB" }
      responses:
        "201": { description: "id (SHA-256 hex of name and bytes), path (absolute), name (as stored) and size in bytes" }
        "400": { description: name is missing }
        "413": { description: The file exceeds 50 MiB }
  /api/v1/workspaces/pick:
    post:
      description: |
        Open the operating system folder chooser on the Host and answer with the
        chosen absolute path, or null when the user cancels. Only available when
        the Host serves a loopback-bound desktop session; 409 otherwise, and 409
        while another dialog is already open. The dialog closes if the page goes
        away before the user answers.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string, description: Dialog title }
                startIn: { type: string, description: Folder to open at, ignored unless it exists }
      responses:
        "200": { description: "path is the chosen folder, or null when cancelled" }
        "409": { description: The system picker is unavailable or already open }
        "500": { description: The picker helper failed }
  /api/v1/file:
    get:
      description: >-
        Read-only preview of one file named by an absolute path from message content, for references that point
        outside every workspace. Same limits and shapes as /api/v1/workspace/file, but the response path is the
        absolute file path. No directory listing, no writes; authenticated like every other route.
      parameters:
        - { name: path, in: query, required: true, schema: { type: string } }
      responses:
        "200": { description: "kind text|image|binary|too-large, path, size; content for text only" }
        "400": { description: Path is not absolute, does not exist or is not a file }
  /api/v1/file/raw:
    get:
      description: Image bytes for one absolute path, mirroring /api/v1/workspace/raw.
      parameters:
        - { name: path, in: query, required: true, schema: { type: string } }
      responses:
        "200": { description: Image bytes }
        "400": { description: Path is not absolute, does not exist or is not a file }
        "413": { description: Image exceeds the preview limit }
        "415": { description: File is not an image }
  /api/v1/workspace/files:
    get:
      parameters:
        - { name: cwd, in: query, required: true, schema: { type: string } }
        - { name: path, in: query, schema: { type: string } }
      responses:
        "200": { description: "One directory level: entries (name, path, kind) and truncated" }
        "400": { description: Path is outside the workspace or cannot be read }
        "403": { description: cwd is not a known workspace }
  /api/v1/workspace/completions:
    get:
      description: >-
        Workspace-relative @path candidates for the Web/Desktop composer. An empty query or a trailing slash lists
        one directory level; a basename fragment searches below the specified directory. Exact names, prefixes,
        substrings and in-order fuzzy matches are ranked before returning at most 20 entries. Walks are bounded
        to 4000 directories and 20000 entries and cancelled when the client disconnects. VCS, dependency and build
        directories are not walked recursively; outside and dangling symlinks are not candidates. No file content
        is read or attached. Paths use forward slashes and quoted paths are passed without their @ or quotes.
      parameters:
        - { name: cwd, in: query, required: true, schema: { type: string } }
        - { name: q, in: query, required: true, schema: { type: string, maxLength: 1024 } }
      responses:
        "200":
          description: Ranked candidates; truncated also reports a walk budget or unreadable descendant
          content:
            application/json:
              schema:
                type: object
                required: [entries, truncated]
                properties:
                  entries:
                    type: array
                    maxItems: 20
                    items:
                      type: object
                      required: [name, path, kind]
                      properties:
                        name: { type: string }
                        path: { type: string, description: Workspace-relative path with forward slashes }
                        kind: { type: string, enum: [file, directory] }
                  truncated: { type: boolean }
        "400": { description: Missing or invalid query, outside path or unreadable scoped directory }
        "403": { description: cwd is not a known workspace }
  /api/v1/workspace/file:
    get:
      parameters:
        - { name: cwd, in: query, required: true, schema: { type: string } }
        - { name: path, in: query, required: true, schema: { type: string } }
      responses:
        "200": { description: "kind text|image|binary|too-large, path, size; content for text only" }
        "400": { description: Path is outside the workspace or is not a file }
        "403": { description: cwd is not a known workspace }
  /api/v1/workspace/raw:
    get:
      parameters:
        - { name: cwd, in: query, required: true, schema: { type: string } }
        - { name: path, in: query, required: true, schema: { type: string } }
      responses:
        "200": { description: Image bytes }
        "413": { description: Image exceeds the preview limit }
        "415": { description: File is not an image }
  /api/v1/workspace/open:
    post:
      description: >-
        Show a known workspace folder in the system file manager (Finder on macOS, File Explorer on Windows, the
        default handler elsewhere). Answers once the launcher has started.
      parameters:
        - { name: cwd, in: query, required: true, schema: { type: string } }
      responses:
        "200": { description: "ok: true" }
        "403": { description: cwd is not a known workspace }
        "500": { description: The file manager could not be started }
  /api/v1/workspace/site:
    post:
      description: >-
        Mint the rendered-preview URL of one workspace file (HTML with its relative CSS, scripts and images). The
        URL points at a separate loopback origin that serves only that workspace, under an unguessable per-workspace
        token, GET/HEAD only, without directory listings; the embedded browser or the system browser loads it.
      parameters:
        - { name: cwd, in: query, required: true, schema: { type: string } }
        - { name: path, in: query, required: true, schema: { type: string } }
      responses:
        "200": { description: "url: http://127.0.0.1:<preview port>/<token>/<workspace-relative path>" }
        "400": { description: Path is outside the workspace or is not a file }
        "403": { description: cwd is not a known workspace }
  /api/v1/workspace/search:
    get:
      parameters:
        - { name: cwd, in: query, required: true, schema: { type: string } }
        - { name: q, in: query, required: true, schema: { type: string } }
      responses:
        "200": { description: "Name matches below the workspace root: entries and truncated" }
  /api/v1/workspace/git:
    get:
      description: >-
        Git state of a workspace plus its local branches, for the composer's branch pill. `state.repository` is
        false when the folder is not inside a git work tree (or git is missing), and `branches` is empty then.
        `state.dirtyFiles` counts modified, staged and untracked files; `state.branch` is absent on a detached HEAD.
        Branches are local refs, most recently committed first.
      parameters:
        - { name: cwd, in: query, required: true, schema: { type: string } }
      responses:
        "200": { description: "state (repository, root, branch, detached, dirtyFiles) and branches (name, upstream)" }
        "403": { description: cwd is not a known workspace }
  /api/v1/workspace/git/switch:
    post:
      description: >-
        Switch to an existing local branch, or with `create: true` create it at HEAD (or at `from`) and switch to it.
        `git switch` runs without `--force`, so a switch that would overwrite uncommitted work is refused instead of
        discarding it; the response then carries `paths`. A failure answers 400 with a `code` the client renders:
        not-a-repository, git-unavailable, invalid-branch-name, branch-already-exists, target-branch-not-found,
        tracked-changes-would-be-overwritten, untracked-changes-would-be-overwritten, conflicts-present,
        operation-in-progress, branch-in-other-worktree, unknown.
      parameters:
        - { name: cwd, in: query, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [branch]
              properties:
                branch: { type: string, description: Branch to switch to, or to create when create=true }
                create: { type: boolean, description: Create the branch before switching to it }
                from: { type: string, description: Start point for create; default HEAD }
      responses:
        "200": { description: The new git state }
        "400": { description: "Branch operation refused: error, code, and paths for an overwrite refusal" }
        "403": { description: cwd is not a known workspace }
  /api/v1/models:
    get:
      description: >-
        Model panel of an unsaved draft: the catalog and the model and thinking level a new session in `cwd` would
        start on (settings default, then the Step product default). An unknown `cwd` falls back to the launch folder.
        Each model carries `thinkingLevels` so the panel can show effort for a model picked before the session exists.
      parameters:
        - { name: cwd, in: query, schema: { type: string } }
      responses:
        "200":
          description: Draft model source
          content:
            application/json:
              schema:
                type: object
                required: [models, availableThinkingLevels]
                properties:
                  model:
                    type: object
                    properties: { provider: { type: string }, id: { type: string } }
                  thinkingLevel: { type: string }
                  availableThinkingLevels: { type: array, items: { type: string } }
                  models: { type: array, items: { type: object } }
                  permissionPreset:
                    type: string
                    enum: [ask, approve-for-me, full-access]
                    description: The tier the Step settings name for `cwd`; a new session starts on it.
                  policies:
                    type: array
                    description: The permission presets the picker offers, labelled by the kernel.
                    items: { $ref: "#/components/schemas/PolicyPreset" }
                  fullAccessAcknowledged:
                    type: boolean
                    description: Full Access was granted with "don't ask again", so picking it needs no confirmation.
  /api/v1/sessions:
    get:
      description: >-
        Every session a user started, newest first after the client sorts. Child-agent sessions (subagent lanes and
        workflow agents) are omitted. Rows carry `name`, `firstMessage` and counts but not the full message text;
        content search is `GET /api/v1/search`. Sessions open in the host also carry their live `status` and
        `unread` (see `GET /api/v1/session-status`).
      responses:
        "200": { description: Session list grouped by cwd by the client }
    post:
      responses:
        "201": { description: New StepCode v3 session }
  /api/v1/session-status:
    get:
      description: >-
        Live status of every session open in the host, cheap enough to poll while a session the page is not
        following runs. `unread` is true when a run completed or failed while no page followed the session's event
        stream; opening the stream clears it. A session missing from the list is not open: nothing runs and nothing
        is unread.
      responses:
        "200":
          description: Open sessions
          content:
            application/json:
              schema:
                type: object
                required: [sessions]
                properties:
                  sessions:
                    type: array
                    items:
                      type: object
                      required: [id, status, unread]
                      properties:
                        id: { type: string }
                        status: { type: string, enum: [idle, running, waiting, completed, failed] }
                        unread: { type: boolean }
  /api/v1/search:
    get:
      description: >-
        Full-text search over every session through the host's session index (SQLite FTS5, derived from the session
        files). Queries whose words all have 3+ characters are ranked by relevance; shorter ones match the 200 most
        recently modified sessions (of the last 30 days unless `cwd` is set) and return at most 50 hits, newest first.
        When the index is unavailable (`state: degraded`) the host scans session files and returns session-level hits
        only. Child-agent sessions are never returned. Closing the request cancels the query.
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 500 } }
        - { name: cwd, in: query, description: Absolute workspace path; only its sessions, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        "200":
          description: Hits in rank order
          content:
            application/json:
              schema:
                type: object
                required: [hits, coverage, state]
                properties:
                  hits:
                    type: array
                    items: { $ref: "#/components/schemas/SessionSearchHit" }
                  coverage:
                    type: object
                    description: Session files indexed versus found; below `total` while the first backfill runs.
                    properties: { indexed: { type: integer }, total: { type: integer } }
                  state: { type: string, enum: [ready, backfilling, degraded] }
        "400":
          description: Invalid parameter; `code` is `invalid_params`
          content:
            application/json:
              schema:
                type: object
                properties: { error: { type: string }, code: { type: string } }
  /api/v1/search/status:
    get:
      responses:
        "200":
          description: Index state
          content:
            application/json:
              schema:
                type: object
                properties:
                  state: { type: string, enum: [ready, backfilling, degraded] }
                  indexed: { type: integer }
                  total: { type: integer }
                  pending: { type: integer }
                  errors: { type: integer }
                  degradedReason: { type: string }
  /api/v1/directories:
    get:
      parameters:
        - name: path
          in: query
          schema: { type: string }
      responses:
        "200": { description: Absolute directory and immediate child folders }
  /api/v1/sessions/{id}:
    get:
      parameters:
        - { $ref: "#/components/parameters/SessionId" }
      responses:
        "200":
          description: >-
            Session snapshot including pendingClarifications and pendingSelections (in-memory requests restored after
            page reload). `permissionPreset` is the tier the kernel enforces now, which can differ from the Step
            settings (a "this session" Full Access grant is not persisted).
            `goal` is the running goal the client steers from the summary board (absent when the session has none), and
            `planMode` reports whether plan mode is active; both are read from the session branch, not from UI state.
            `revision` is the newest event revision the host had published when this snapshot was serialized; a client
            that has already applied a newer stream event must ignore this answer.
            `interruptedTurn` is true when the newest recorded turn was cut off — a prompt with no reply, or a reply the
            kernel recorded as `aborted` — and false while a turn is still running.
          content:
            application/json:
              schema:
                type: object
                properties:
                  revision:
                    type: integer
                    description: Newest published event revision at serialization time (see the SSE `agent`/`status` events)
                  interruptedTurn:
                    type: boolean
                    description: >-
                      The newest turn did not finish (runtime.ts `hasInterruptedTurn`): derived from the session
                      entries, so it survives a host restart. False while a turn runs or is starting.
                  lastRunAborted:
                    type: boolean
                    description: The last run was stopped by the user (runtime.ts `lastRunAborted`), so it has no finished reply to credit.
                  permissionPreset: { type: string, enum: [ask, approve-for-me, full-access] }
                  subagentLanes:
                    type: array
                    description: Latest bounded live lane snapshots for reconnects; process memory, not model context or resumed execution.
                    items: { $ref: "#/components/schemas/SubagentLaneSnapshot" }
                  goal:
                    type: object
                    description: The session's goal (runtime.ts `projectGoal`); absent when there is none.
                    properties:
                      id: { type: string }
                      objective: { type: string }
                      status:
                        type: string
                        enum: [active, paused, blocked, usage_limited, budget_limited, complete]
                      tokensUsed: { type: integer }
                      timeUsedSeconds: { type: integer, description: "Active-only elapsed seconds; the client ticks from it between snapshots" }
                      tokenBudget: { type: integer }
                      rounds: { type: integer, description: "Completed agent runs; progress, not a stop condition" }
                  planMode:
                    type: object
                    description: Plan mode state (runtime.ts `projectPlanMode`).
                    properties:
                      enabled: { type: boolean }
                      planFilePath: { type: string }
                      planSource: { type: string, enum: [user, agent, unknown] }
                  entries:
                    type: array
                    items:
                      type: object
                      properties:
                        customType:
                          type: string
                          description: On a custom step-subagent-response entry, identifies a durable completed child answer.
                        data:
                          $ref: "#/components/schemas/CompletedSubagentResponse"
                        details:
                          description: >-
                            Lifecycle projection on custom_message / agent-notification entries only.
                            Event and status must match; notification text is not a status protocol.
                          type: object
                          required: [agentId, event, status]
                          additionalProperties: false
                          properties:
                            agentId: { type: string }
                            event:
                              type: string
                              enum: [background_done, background_failed, background_interrupted, background_progress, background_restarted, background_needs_input]
                            status: { type: string, enum: [running, completed, failed, aborted] }
                        goalRound:
                          type: integer
                          minimum: 1
                          description: >-
                            On a step-goal continuation custom_message only: the round (1-based) this
                            continuation starts, from its validated details.iteration. The client draws
                            the flow's round separators from it.
                        thinkingTimings:
                          $ref: "#/components/schemas/ThinkingTimings"
                        promptCommand:
                          type: string
                          description: >-
                            On a user message only: the prompt-command line (`/<template> args`) the user typed,
                            when this message is its expansion. Paired by content from a host-recorded
                            `stepcode-web.prompt-command` custom entry; never part of the model's context.
                  policies:
                    type: array
                    items: { $ref: "#/components/schemas/PolicyPreset" }
                  pendingSelections:
                    type: array
                    items: { $ref: "#/components/schemas/SelectionRequest" }
                  pendingTextInputs:
                    type: array
                    description: Kernel text prompts (`ui.input`) waiting for an answer (in memory, restored after reload)
                    items: { $ref: "#/components/schemas/TextInputRequest" }
                  sideAnswers:
                    type: array
                    description: >-
                      `/btw` answers of this session, oldest first (in memory for the life of the host process, never a
                      session entry, never model context).
                    items: { $ref: "#/components/schemas/SideAnswer" }
                  pendingClarifications:
                    type: array
                    items: { $ref: "#/components/schemas/ClarificationRequest" }
                  pendingApprovals:
                    type: array
                    items: { $ref: "#/components/schemas/ApprovalRequest" }
                  queuedMessages:
                    type: array
                    description: Messages sent during a turn that wait for it to end (in memory, lost on host restart)
                    items: { $ref: "#/components/schemas/QueuedMessage" }
                  steeringMessages:
                    type: array
                    description: Steered messages the running turn has not read yet
                    items: { $ref: "#/components/schemas/SteeringMessage" }
                  retry: { $ref: "#/components/schemas/SessionRetry" }
    delete:
      parameters:
        - { $ref: "#/components/parameters/SessionId" }
      responses:
        "200": { description: Session deleted }
  /api/v1/sessions/{id}/children:
    get:
      summary: Agents of one workflow run started by this session
      description: >-
        Workflow agents' sessions are `workflow-<runId>-<agentId>`, written next to the parent's. Children that record
        a different parentSessionId are left out. Ordered by agent number.
      parameters:
        - { $ref: "#/components/parameters/SessionId" }
        - { name: workflowRun, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: The run's agents; empty when none are found.
          content:
            application/json:
              schema:
                type: object
                required: [children]
                properties:
                  children:
                    type: array
                    items:
                      type: object
                      required: [id, title, messageCount, modified]
                      properties:
                        id: { type: string }
                        title: { type: string, description: The agent's task, its first user message cut short }
                        messageCount: { type: integer }
                        modified: { type: string, format: date-time }
        "400": { description: workflowRun is missing }
  /api/v1/sessions/{id}/children/{childId}:
    get:
      summary: A child agent's transcript, read-only
      description: >-
        The current branch of a child-agent session (subagent or workflow agent) that this session spawned. The file
        is only read, never opened as a session, so a child still running is not disturbed and cannot be prompted.
        A child naming another parentSessionId, or a session that is not a child agent, is 404.
      parameters:
        - { $ref: "#/components/parameters/SessionId" }
        - { name: childId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The child's entries, projected like a session snapshot's.
          content:
            application/json:
              schema:
                type: object
                required: [id, parentId, cwd, modified, readOnly, entries]
                properties:
                  id: { type: string }
                  parentId: { type: string }
                  cwd: { type: string }
                  modified: { type: string, format: date-time }
                  readOnly: { type: boolean, enum: [true] }
                  entries: { type: array, items: { type: object } }
        "404": { description: Not a child agent of this session }
  /api/v1/sessions/{id}/events:
    get:
      parameters:
        - { $ref: "#/components/parameters/SessionId" }
      responses:
        "200":
          description: >-
            SSE snapshot and agent/status/approval/clarification_required/clarification_resolved/selection_required/
            selection_resolved/text_input_required/text_input_resolved/notice/side-answer/queue/subagent_lane events.
            subagent_lane carries lane (a SubagentLaneSnapshot, or null when this runtime shuts down).
            This live-only frame replaces that lane's state and does not steer the model or persist progress.
            Completed answers are separate step-subagent-response custom entries carrying customType and data.
            clarification_required carries clarification and selection_required carries selection; the resolved events
            carry id. text_input_required carries `input` (id, sessionId, title, placeholder) and
            text_input_resolved carries id. side-answer carries `answer` (id, question, text, model, unavailable,
            createdAt) for the rail tab. `notice` carries level (info|warning|error), text and optional markdown:
            it is command output from the kernel's `ui.notify`, shown in the transcript but never persisted and never
            part of the model's context. `transient: true` marks an announcement of state the client already renders
            (plan mode, the permission tier): shown briefly, never added to the conversation. A failure the host cannot attribute to a request is sent as `web_error` with
            a message. queue carries a QueueState (queued, steering).
            Agent envelopes optionally carry thinkingTimings, keyed by original content-block index, with host-observed
            epoch-millisecond startedAt/endedAt fields. Live intervals may omit endedAt; saved intervals are complete.
            A user message_start envelope may carry promptCommand: the prompt-command line its text expanded from.
            Every event (and the session snapshot) carries `revision`, monotonic per bound session; a snapshot whose
            revision is older than an event the page has already applied describes a state it has left.
  /api/v1/sessions/{id}/messages:
    post:
      parameters:
        - { $ref: "#/components/parameters/SessionId" }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string }
                files:
                  type: array
                  items: { type: string }
                  description: |
                    Upload ids (`POST /api/v1/uploads`) the message refers to. The Host
                    appends one `<attached_file name path bytes>` block per file after the
                    text: a UTF-8 file's content (cut past 40 000 characters, saying where
                    to continue), or for any other file `type="binary"` and where to read it.
                attachments: { type: array, description: "Paperclip files: name, mimeType, base64 data" }
      responses:
        "202": { description: Prompt accepted }
        "400": { description: text is missing, or an attachment or upload id is invalid }
        "409": { description: A turn revert is writing files }
  /api/v1/sessions/{id}/steer:
    post:
      parameters:
        - { $ref: "#/components/parameters/SessionId" }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string }
                files:
                  type: array
                  items: { type: string }
                  description: |
                    Upload ids (`POST /api/v1/uploads`) the message refers to. The Host
                    appends one `<attached_file name path bytes>` block per file after the
                    text: a UTF-8 file's content (cut past 40 000 characters, saying where
                    to continue), or for any other file `type="binary"` and where to read it.
                attachments: { type: array, description: "Paperclip files: name, mimeType, base64 data" }
      responses:
        "202": { description: Steer accepted; the running turn reads it before its next model call }
        "400": { description: text is missing, an attachment or upload id is invalid, or the kernel refused the steer (an extension command) }
  /api/v1/sessions/{id}/queue:
    post:
      summary: Queue a message sent during a turn
      description: >-
        The message waits, editable, until the running turn settles; then the Host sends the oldest queued message as
        the next turn, one turn per message. An interrupted or failed turn leaves the queue as it is. When no turn runs
        and nothing is queued, the message starts at once. Changes are also published as the `queue` SSE event.
      parameters:
        - { $ref: "#/components/parameters/SessionId" }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string }
                files:
                  type: array
                  items: { type: string }
                  description: Upload ids; their content is added when the message is dispatched.
                attachments: { type: array, description: "Paperclip files: name, mimeType, base64 data" }
      responses:
        "202":
          description: Queued; the new queue state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QueueState" }
        "400": { description: text is missing, or an attachment or upload id is invalid }
  /api/v1/sessions/{id}/queue/steer:
    post:
      summary: Steer every queued message into the running turn
      description: >-
        Without a running turn the oldest queued message starts as a new turn instead. Messages the kernel refuses to
        steer (extension commands) stay queued.
      parameters:
        - { $ref: "#/components/parameters/SessionId" }
      responses:
        "202":
          description: The new queue state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QueueState" }
        "404": { description: The queue is empty }
        "409": { description: The kernel refused a steer, or the session waits on the user }
  /api/v1/sessions/{id}/queue/{itemId}:
    patch:
      summary: Replace a queued message's text
      parameters:
        - { $ref: "#/components/parameters/SessionId" }
        - { name: itemId, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string }
      responses:
        "200":
          description: The new queue state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QueueState" }
        "400": { description: text is missing }
        "404": { description: Not queued (already dispatched or removed) }
    delete:
      summary: Remove a queued message
      parameters:
        - { $ref: "#/components/parameters/SessionId" }
        - { name: itemId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The new queue state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QueueState" }
        "404": { description: Not queued (already dispatched or removed) }
  /api/v1/sessions/{id}/queue/{itemId}/steer:
    post:
      summary: Steer one queued message into the running turn (or start it now when no turn runs)
      parameters:
        - { $ref: "#/components/parameters/SessionId" }
        - { name: itemId, in: path, required: true, schema: { type: string } }
      responses:
        "202":
          description: The new queue state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QueueState" }
        "404": { description: Not queued (already dispatched or removed) }
        "409": { description: The kernel refused the steer, or the session waits on the user }
  /api/v1/sessions/{id}/interrupt:
    post:
      parameters:
        - { $ref: "#/components/parameters/SessionId" }
      responses:
        "200": { description: Agent interrupted }
  /api/v1/sessions/{id}/fork:
    post:
      description: >-
        Branch the session at `entryId` (a recorded turn) or at its last user message, and rebind this host session to
        the new branch. The kernel always creates a new session id and file; `sessionId` in the response is that new id,
        which is immediately readable through `GET /sessions/{id}`. The new session is named after the parent's current
        title plus `_fork`, so forking a fork appends again (`title_fork_fork`). Refused while a turn runs or while
        another fork is in progress.
      parameters:
        - { $ref: "#/components/parameters/SessionId" }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                entryId: { type: string, description: Entry to branch at; omit to use the last user message }
      responses:
        "200":
          description: Fork result
          content:
            application/json:
              schema:
                type: object
                properties:
                  cancelled: { type: boolean }
                  sessionId:
                    type: string
                    description: The session now bound — the new branch on success, the previous id otherwise
        "400": { description: The entry cannot be forked, a turn is running, or a fork is already in progress }
  /api/v1/sessions/{id}/name:
    patch:
      parameters:
        - { $ref: "#/components/parameters/SessionId" }
      responses:
        "200": { description: Renamed session snapshot }
  /api/v1/sessions/{id}/archive:
    patch:
      parameters:
        - { $ref: "#/components/parameters/SessionId" }
      responses:
        "200": { description: Archived or restored session snapshot }
  /api/v1/sessions/{id}/approvals/decision:
    post:
      parameters:
        - { $ref: "#/components/parameters/SessionId" }
      responses:
        "200": { description: Approval decision accepted }
        "404": { description: Approval no longer pending }
  /api/v1/sessions/{id}/skills:
    get:
      description: >-
        What the composer's slash menu offers for this session: skills as `/skill:<name>` (empty when skill
        commands are disabled) and prompt commands as `/<name>` — prompt templates, plugin `commands/*.md`
        included, that the kernel expands on send. A template named like a registered extension command or a
        Web surface (`mcp`, `btw`, `feedback`) never expands and is not listed.
      parameters:
        - { $ref: "#/components/parameters/SessionId" }
      responses:
        "200":
          description: Skills and prompt commands, each by name
          content:
            application/json:
              schema:
                type: object
                properties:
                  skills:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        description: { type: string }
                  commands:
                    type: array
                    items:
                      type: object
                      required: [name, description]
                      properties:
                        name: { type: string }
                        description: { type: string }
                        argumentHint: { type: string, description: "The template's `argument-hint` frontmatter" }
  /api/v1/workspace/skills:
    get:
      description: >-
        Skills and prompt commands for a folder without a session yet: what a new session there would load. The
        folder's resources are resolved as a session would, without extensions; installed plugins' skills and
        commands are added from plugin discovery, so a plugin installed a moment ago is listed at once.
      parameters:
        - { name: cwd, in: query, required: true, schema: { type: string } }
      responses:
        "200": { description: "Same shape as /api/v1/sessions/{id}/skills" }
        "403": { description: Folder is not a known workspace }
  /api/v1/mcp:
    get:
      description: >-
        MCP servers of the host process (one list, written by the session that started last), including servers
        disabled in config.toml.
      responses:
        "200":
          description: Server status
          content:
            application/json:
              schema:
                type: object
                properties:
                  servers:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        status: { type: string, enum: [connecting, connected, failed, disabled] }
                        toolCount: { type: integer }
                        error: { type: string }
  /api/v1/settings/mcp:
    get:
      description: >-
        MCP servers in global settings only: user declarations followed by plugin declarations and
        the Host's last known connection state. User config is safe metadata only, never stored commands,
        arguments, paths, URLs, literal environment/header values or OAuth secrets. protectedFields names
        omitted fields; omission does not mean empty or removed. revision binds edits to the full stored
        declaration. Plugin rows have no editable config/revision. Errors are generic connection diagnostics.
      responses:
        "200":
          description: Configured servers
          content:
            application/json:
              schema:
                type: object
                properties:
                  servers:
                    type: array
                    items: { $ref: "#/components/schemas/SettingsMcpServer" }
    post:
      description: Add a server to the global config. A name already in use is a 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, config]
              properties:
                name: { type: string }
                config: { $ref: "#/components/schemas/McpServerConfig" }
      responses:
        "201": { description: Added }
        "400": { description: Invalid name or declaration }
        "409": { description: Name already used }
  /api/v1/settings/mcp/{name}:
    parameters:
      - { name: name, in: path, required: true, schema: { type: string } }
    put:
      description: >-
        Edit an existing global user declaration with a revision-checked patch, not a replacement config.
        Omitted fields and keep operations preserve authoritative stored values, including secrets and
        empty tool allow lists. set supplies a new value; remove explicitly deletes a field. Transport
        switches must remove incompatible fields explicitly. Plugin declarations cannot be edited here.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [patch]
              properties:
                patch: { $ref: "#/components/schemas/McpSettingsPatch" }
      responses:
        "200":
          description: Saved under the global config lock
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean, const: true }
        "401": { $ref: "#/components/responses/HostAuthorizationRequired" }
        "400": { description: Invalid declaration or patch (mcp_settings_invalid internally); wire response contains only error }
        "404": { description: No such user server }
        "409":
          description: >-
            mcp_settings_changed internally. The current Host translates it to error text only, with
            no code field; reload the safe DTO/revision before editing again.
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: { type: string, const: "MCP configuration changed; reload before editing" }
    patch:
      description: >-
        Turn a server on or off. For a plugin server this writes an override entry
        (`mcp_servers."<plugin>__<server>" = { enabled = false }`) that discovery honours, and removes it again
        when switching back on.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        "200": { description: Updated }
        "404": { description: No such server }
    delete:
      description: Remove a user server from the global config.
      responses:
        "200": { description: Removed }
        "404": { description: No such user server }
  /api/v1/settings/plugins:
    get:
      description: >-
        Installed user plugins, every configured marketplace's plugins with an `installed` flag, and the
        marketplaces themselves. The built-in marketplace is materialized first.
      responses:
        "200":
          description: Plugin catalog
          content:
            application/json:
              schema:
                type: object
                properties:
                  installed:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        name: { type: string }
                        version: { type: string }
                        description: { type: string }
                        mcpServers: { type: array, items: { type: string } }
                        warnings: { type: array, items: { type: string } }
                  available:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        description: { type: string }
                        marketplace: { type: string }
                        installed: { type: boolean }
                  marketplaces:
                    type: array
                    items: { $ref: "#/components/schemas/SettingsMarketplace" }
                  warnings: { type: array, items: { type: string } }
    post:
      description: Install a marketplace plugin into the user plugin root.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                marketplace: { type: string }
      responses:
        "201": { description: Installed, with the installer's warnings }
        "404": { description: No such marketplace plugin }
        "409": { description: Already installed, or the copy failed }
  /api/v1/settings/plugins/{id}:
    delete:
      description: Uninstall a user plugin by its manifest id.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Uninstalled }
        "404": { description: Not installed }
  /api/v1/settings/marketplaces:
    post:
      description: >-
        Add a marketplace from a local folder, a git URL or `owner/repo` (cloned from GitHub). A clone can take
        a minute; the response arrives when it finishes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source]
              properties:
                source: { type: string }
      responses:
        "201": { description: Added, with any warnings }
        "400": { description: The source could not be acquired }
  /api/v1/settings/marketplaces/{name}:
    delete:
      description: Remove a marketplace checkout. Installed plugins stay.
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Removed }
        "400": { description: Unknown or built-in marketplace }
  /api/v1/settings/marketplaces/{name}/update:
    post:
      description: Pull a git marketplace. A local checkout reports that it cannot be updated automatically.
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Updated, with any warnings }
        "400": { description: Unknown, built-in or non-git marketplace }
  /api/v1/settings/skills:
    get:
      description: >-
        User-scope skills (from `~/.stepcode/agent/skills`, `~/.stepcode/skills`, `~/.agents/skills`,
        `~/.claude/skills` and configured packages) and the skills installed plugins contribute. Only those in
        StepCode's own skill folders are deletable; plugin and package skills are read-only.
      responses:
        "200":
          description: Skills
          content:
            application/json:
              schema:
                type: object
                properties:
                  skills:
                    type: array
                    items: { $ref: "#/components/schemas/SettingsSkill" }
    post:
      description: Create `SKILL.md` in `<agentDir>/skills/<name>`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, description]
              properties:
                name: { type: string }
                description: { type: string }
                instructions: { type: string }
      responses:
        "201": { description: Created }
        "400": { description: Invalid name, or a missing description }
        "409": { description: A skill with that name already exists }
    patch:
      description: >-
        Turn a user skill on or off by writing a `+path` / `-path` entry into the global `skills` setting.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, enabled]
              properties:
                id: { type: string }
                enabled: { type: boolean }
      responses:
        "200": { description: Updated }
        "404": { description: Not a user skill that can be switched }
    delete:
      description: >-
        Delete a skill from StepCode's own skill folders (`id` is its file path) and drop its enable/disable
        entry. A skill in a shared folder such as `~/.claude/skills` is a 403.
      parameters:
        - { name: id, in: query, required: true, schema: { type: string } }
      responses:
        "200": { description: Deleted }
        "403": { description: Outside StepCode's own skill folders }
        "404": { description: Not a user skill }
  /api/v1/settings/skills/import:
    post:
      description: Copy a local folder containing `SKILL.md` into the user skill folder.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path: { type: string }
      responses:
        "201": { description: Imported, with the skill's name }
        "400": { description: No SKILL.md in that folder, or an invalid skill name }
        "409": { description: A skill with that name already exists }
  /api/v1/settings/models:
    get:
      description: >-
        The custom model providers declared in `models.json`, as the settings screen lists them. Only
        user declarations appear; the built-in catalog is not configurable. Each row reports where its API
        key comes from (`stored` in auth.json, `configured` in the declaration, or `none`) and never the key.
      responses:
        "200":
          description: Configured providers
          content:
            application/json:
              schema:
                type: object
                properties:
                  providers:
                    type: array
                    items: { $ref: "#/components/schemas/SettingsModelProvider" }
    post:
      description: >-
        Add a provider to `models.json` and store its API key, when one was given, in auth.json. An id
        already in use is a 409; `step` is refused because that entry is the account login.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: { type: string, description: "Provider ID; lowercase letters, digits, '.', '_', '-'" }
                name: { type: string }
                baseUrl:
                  type: string
                  description: >-
                    Service root, with or without `/v1`. Stored normalized for `api`: OpenAI protocols give a
                    bare root `/v1`; Anthropic Messages drops one trailing `/v1`. Any other path is kept.
                api: { type: string, description: "Protocol identifier, e.g. openai-completions" }
                apiKey: { type: string, description: "Stored in auth.json, never written to models.json" }
                models: { type: array, items: { $ref: "#/components/schemas/ModelsJsonModelEntry" } }
      responses:
        "201": { description: Added }
        "400": { description: Invalid id, address, protocol or catalog }
        "409": { description: Id already used, or the entry is not an API-key credential }
  /api/v1/settings/models/discover:
    post:
      description: >-
        Ask one endpoint which models it advertises, for the form's "fetch available models" action. The
        body carries the draft the user is editing rather than a saved provider, so the address, protocol
        and key are used as given and nothing is stored. A blank key falls back to the stored credential
        for `providerId` (the credential file, then the declaration's own key), as on save and in the
        connection test. The address is normalized as on save, then
        OpenAI-shaped protocols list at `{baseUrl}/models` with bearer auth; Anthropic Messages at
        `{baseUrl}/v1/models` with `x-api-key`. A reply over 4 MiB is refused.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [baseUrl]
              properties:
                providerId: { type: string, description: "Provider whose stored key is used when apiKey is blank" }
                baseUrl: { type: string }
                api: { type: string }
                apiKey: { type: string, description: "Used for this request only" }
      responses:
        "200":
          description: The models the endpoint advertises, in its own order
          content:
            application/json:
              schema:
                type: object
                properties:
                  models:
                    type: array
                    items: { $ref: "#/components/schemas/DiscoveredModel" }
        "400": { description: Unusable address or a protocol with no readable listing }
        "502": { description: "The endpoint refused, was unreachable, or did not answer with a model listing" }
  /api/v1/settings/models/test:
    post:
      description: >-
        Send a one-token ping to one model of the declaration currently in the form, saved or not. The body
        carries the draft (provider id, address, protocol, optional key, model id); a blank key falls back to
        the stored credential for the provider id. Answers over the provider stack a session would use.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [providerId, baseUrl, api, modelId]
              properties:
                providerId: { type: string }
                baseUrl: { type: string }
                api: { type: string }
                apiKey: { type: string, description: "Used for this request only" }
                modelId: { type: string }
      responses:
        "200": { description: The model answered the ping }
        "400": { description: Missing fields or the model id is not usable }
        "502": { description: "The provider rejected the request or reported an error" }
        "504": { description: No answer within the test timeout }
  /api/v1/settings/models/open-config:
    post:
      description: >-
        Open the models.json the kernel reads in the application the system associates with it (on macOS,
        the default text editor when no application is associated). A missing file is first created with an
        empty provider table. Edits apply to sessions started afterwards.
      responses:
        "200":
          description: The editor was launched
          content:
            application/json:
              schema:
                type: object
                required: [path]
                properties:
                  path: { type: string, description: Absolute path of the opened models.json }
        "500": { description: The file could not be created or no application could open it }
  /api/v1/settings/models/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    put:
      description: >-
        Replace one provider's declaration. A typed key is stored in auth.json; an empty `apiKey` keeps the
        stored one, and `removeKey` removes it. The key is never sent to the browser, so a blank field means
        "unchanged" rather than "clear".
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                baseUrl: { type: string, description: "Normalized for `api` as on create" }
                api: { type: string }
                apiKey: { type: string }
                removeKey: { type: boolean, description: "Remove the stored key; ignored when apiKey is set" }
                models: { type: array, items: { $ref: "#/components/schemas/ModelsJsonModelEntry" } }
      responses:
        "200": { description: Saved }
        "400": { description: Invalid address, protocol or catalog }
        "404": { description: No such provider }
        "409": { description: The credential is not an API key }
    delete:
      description: Remove a provider, and the API key this screen stored for it.
      responses:
        "200": { description: Deleted }
        "404": { description: No such provider }
  /api/v1/sessions/{id}/turns/{turnId}/site:
    post:
      description: >-
        Mint the rendered-preview URL of a file as the turn left it: the file on disk with every later turn's patches
        to it reversed (reverted turns skipped). The latest version is the plain site URL; an earlier one is served
        from memory at the file's URL plus `?rev=<id>`, so relative assets still resolve. `exact` is false when a later
        change cannot be reversed (no patch, recreated file, or edited outside the session); the URL then shows the
        current file.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: turnId, in: path, required: true, schema: { type: string } }
        - { name: path, in: query, required: true, schema: { type: string } }
      responses:
        "200": { description: "url, exact" }
        "400": { description: Path is outside the workspace, is not a file, or the version is too large }
  /api/v1/sessions/{id}/turns/{turnId}/revert:
    post:
      description: >-
        Reverse-apply the edit/write patches (tool result `details.patch`) of the turn that starts at
        user entry `turnId`. Every file is checked before anything is written; a refusal (409) writes nothing, but
        a failure while writing is returned as an error and the files already written stay written. Paths that
        name the same file (case, symlinks) count as one file. Hunks may have moved (later edits elsewhere
        in the file) and their edge context may have changed, but the lines the turn changed must be intact.
        Successful edit/write calls without a patch (large or binary files) are left as they are and listed in
        `skipped`; changes made through `bash` are not tracked, so a file a command changed no longer matches and is
        refused. A file the turn created is deleted only when reversing reaches that creating write with nothing
        left and no unpatched change to the same path. A `stepcode-web.turn-revert` custom message then tells the
        model which files were restored and lists the turn in the snapshot's `revertedTurns`.
      parameters:
        - { $ref: "#/components/parameters/SessionId" }
        - { name: turnId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Files restored
          content:
            application/json:
              schema:
                type: object
                properties:
                  snapshot: { type: object }
                  paths: { type: array, items: { type: string } }
                  skipped:
                    type: array
                    items:
                      type: object
                      required: [path, reason]
                      properties:
                        path: { type: string }
                        reason: { type: string, enum: [too_large, binary, unreadable, unknown] }
        "409":
          description: >-
            The revert was refused before any file was written. `modified`: a file no longer matches the turn's
            patches, and undoing the later turns first, newest first and each as a whole, was not found to help.
            `conflict`: undoing the later, not yet reverted turns that depend on this turn's files first was
            checked to let this turn undo.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                  code: { type: string, enum: [busy, reverted, empty, missing, conflict, modified] }
                  path:
                    { type: string, description: "The file that blocked it (missing, conflict, modified)" }
  /api/v1/sessions/{id}/policy:
    patch:
      description: >-
        Switch the tier through the kernel's `/permissions` command. Full Access without a remembered acknowledgment
        makes the kernel ask the risk question: the response then returns at once with the question in
        `pendingSelections` and the tier unchanged, and answering it through `selections/response` applies the
        choice (a dismissed or cancelled question keeps the previous tier). While a session that started on a
        persisted Full Access is still asking, a Full Access request adds nothing.
      parameters:
        - { $ref: "#/components/parameters/SessionId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [preset]
              properties:
                preset: { type: string, enum: [ask, approve-for-me, full-access] }
      responses:
        "200": { description: Session snapshot }
        "400": { description: Unknown preset, or a permission question from an earlier switch is still open }
  /api/v1/sessions/{id}/selections/response:
    post:
      description: >-
        Answer a kernel selection (`ui.select`), such as the Full Access risk question. Resolves after the command
        that asked has applied the answer.
      parameters:
        - { $ref: "#/components/parameters/SessionId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: { type: string }
                value:
                  type: string
                  description: One of the offered options, verbatim. Omit to dismiss the question.
      responses:
        "200": { description: Session snapshot after the answer was applied }
        "400": { description: Missing id or a non-string value }
        "404": { description: Selection no longer pending, or the value was not offered; the question stays open }
  /api/v1/sessions/{id}/text-inputs/response:
    post:
      description: >-
        Answer a kernel text prompt (`ui.input`), such as the `/feedback` comment field. Resolves after the command
        that asked has applied the answer.
      parameters:
        - { $ref: "#/components/parameters/SessionId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: { type: string }
                value:
                  type: string
                  description: >-
                    The submitted text; an empty string is a real answer. Omit to dismiss the prompt (the kernel treats
                    it as cancelled).
      responses:
        "200": { description: Session snapshot after the answer was applied }
        "400": { description: Missing id or a non-string value }
        "404": { description: Text input no longer pending }
  /api/v1/sessions/{id}/side-answers/clear:
    post:
      description: Forget this session's `/btw` answers (the rail panel's Clear action).
      parameters:
        - { $ref: "#/components/parameters/SessionId" }
      responses:
        "200": { description: Answers cleared }
  /api/v1/sessions/{id}/clarifications/response:
    post:
      parameters:
        - { $ref: "#/components/parameters/SessionId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, cancelled]
              properties:
                id: { type: string }
                cancelled: { type: boolean }
                answers:
                  description: Required unless cancelled. One reply per question, in request order.
                  type: array
                  items:
                    type: object
                    required: [id]
                    properties:
                      id: { type: string }
                    oneOf:
                      - properties: { optionIndex: { type: integer, minimum: 0 } }
                        required: [optionIndex]
                      - properties: { text: { type: string, minLength: 1 } }
                        required: [text]
                      - properties: { skipped: { const: true } }
                        required: [skipped]
      responses:
        "200": { description: Response accepted; resumes the existing clarify_user call }
        "400": { description: Invalid or incomplete answers; request remains pending }
        "404": { description: Request no longer pending in this session }
  /api/v1/sessions/{id}/goal:
    patch:
      description: |
        One control from the summary board's goal section. Each action runs the
        same `/goal` slash command the CLI issues (`start`, `pause`, `resume`,
        `edit`, `clear`), so there is one implementation of goal control.
        Answered 202 because a slash command is a kernel prompt; the resulting
        goal arrives in the session snapshot's `goal`.
      parameters:
        - { $ref: "#/components/parameters/SessionId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [start, pause, resume, edit, clear] }
                objective: { type: string, description: "Required for start and edit" }
      responses:
        "202": { description: Goal control accepted }
        "400": { description: "Unknown action, or a missing objective for start/edit" }
  /api/v1/sessions/{id}/mode:
    patch:
      description: |
        Start or stop a composer mode. `plan` toggles plan mode; `ultraloop` is
        rejected by hosts that offer per-turn opt-in only; `goal` starts or clears
        the goal and needs `goal` text when enabling.
      parameters:
        - { $ref: "#/components/parameters/SessionId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode, enabled]
              properties:
                mode: { type: string, enum: [goal, plan, ultraloop] }
                enabled: { type: boolean }
                goal: { type: string }
      responses:
        "202": { description: Mode command accepted }
  /api/v1/sessions/{id}/feedback/evidence:
    get:
      description: >-
        Prepare a feedback report for this conversation and describe what it would carry. The consent dialog reads this
        before offering to send anything, and returns the `token` with the submission so the report contains exactly
        the evidence that was shown. A prepared report is held briefly and consumed once.
      parameters:
        - { $ref: "#/components/parameters/SessionId" }
      responses:
        "200":
          description: The prepared evidence, described for the user.
          content:
            application/json:
              schema:
                type: object
                required: [token, preview]
                properties:
                  token: { type: string, description: "Names the prepared evidence; sent back with the submission" }
                  preview:
                    type: object
                    required: [surface, version, channel, summary, diagnostics]
                    properties:
                      surface: { type: string, enum: [web, desktop] }
                      version: { type: string }
                      channel: { type: string, enum: [dev, release] }
                      sessionId: { type: string }
                      summary: { type: boolean, description: "Content-free session summary is attached" }
                      diagnostics: { type: boolean, description: "Host log excerpt is attached" }
                      archive:
                        type: array
                        items:
                          type: object
                          required: [name, bytes]
                          properties:
                            name: { type: string }
                            bytes: { type: integer }
                            note: { type: string, description: "Bound or truncation the kernel applied" }
                      archiveNote: { type: string, description: "Why the archive is absent, when it was skipped" }
  /api/v1/sessions/{id}/feedback:
    post:
      description: >-
        File feedback about this session. The kernel assembles the body and the session archive, redacts them, and
        delivers both; the host never assembles its own payload. The built-in collector route is used unless
        `STEPCODE_FEEDBACK_ENDPOINT` overrides it. A report the kernel rejects (unknown category, invalid body) answers
        400 with the reason.
      parameters:
        - { $ref: "#/components/parameters/SessionId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sentiment, comment]
              properties:
                sentiment: { type: string, enum: [up, down] }
                topic: { type: string, description: "Composer topic; folded into the comment and mapped to a kernel category" }
                comment: { type: string }
                token: { type: string, description: "The token of the evidence the dialog displayed" }
      responses:
        "200": { description: Submitted; `message` states the feedback id and any skipped archive }
        "400": { description: "The kernel rejected the report, or delivery failed and the outcome is not a submission" }
  /api/v1/sessions/{id}/model:
    patch:
      parameters:
        - { $ref: "#/components/parameters/SessionId" }
      responses:
        "200": { description: Persisted model selection }
  /api/v1/sessions/{id}/models/refresh:
    post:
      parameters:
        - { $ref: "#/components/parameters/SessionId" }
      responses:
        "200": { description: Re-read models.json and return the session snapshot with the refreshed model catalog }
  /api/v1/sessions/{id}/files:
    get:
      parameters:
        - { $ref: "#/components/parameters/SessionId" }
      responses:
        "200": { description: Workspace file tree }
  /api/v1/sessions/{id}/file:
    get:
      parameters:
        - { $ref: "#/components/parameters/SessionId" }
      responses:
        "200": { description: Workspace file contents }
components:
  securitySchemes:
    HostCookie:
      type: apiKey
      in: cookie
      name: stepcode_web
      description: >-
        Signed HttpOnly SameSite=Strict launch cookie. APIs also enforce allowed Origin when present
        and reject Sec-Fetch-Site same-site/cross-site. Missing Origin alone is allowed for local clients.
        This authorizes local Host access, not a Step account; the Host listens on 127.0.0.1 only.
  responses:
    HostAuthorizationRequired:
      description: Invalid/missing Host cookie, disallowed supplied Origin or refused fetch metadata; no Step account is required for local migration.
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error: { type: string, const: "Authentication required" }
    MigrationJobResponse:
      description: Current job; inspect per-item results and poll stopping jobs
      content:
        application/json:
          schema: { $ref: "#/components/schemas/MigrationJob" }
    MigrationInvalid:
      description: Invalid request, identifiers, path, selection, scope, missing acknowledgement or unsupported action
      content:
        application/json:
          schema: { $ref: "#/components/schemas/MigrationError" }
    MigrationConflict:
      description: >-
        source-changed, target-changed, preview-changed, preview-expired, plan-expired, migration-blocked,
        batch-target-conflict, rule-batch-impact-conflict, idempotency-conflict, migration-busy,
        recovery-target-changed, recovery-impact-changed, recovery-preview-expired, publication-conflict,
        or a journal/session-reservation conflict. Re-preview changed inputs; never retry publication blindly.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/MigrationError" }
    MigrationNotFound:
      description: candidate-not-found, preview-not-found, plan-not-found, job-not-found, recovery-unavailable or migration-route-not-found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/MigrationError" }
    MigrationBodyTooLarge:
      description: migration-body-too-large (over 65536 bytes, declared or streamed)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/MigrationError" }
    MigrationContentType:
      description: invalid-content-type (when supplied, Content-Type must be application/json)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/MigrationError" }
    MigrationLimit:
      description: preview-limit (500 entries/128 MiB weighted cache) or plan-limit (100 cached plans)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/MigrationError" }
    MigrationUnavailable:
      description: migration-unavailable or migration-closed; optional migration state cannot disable existing chats
      content:
        application/json:
          schema: { $ref: "#/components/schemas/MigrationError" }
    DesktopOnboardingResponse:
      description: Durable invitation state
      content:
        application/json:
          schema: { $ref: "#/components/schemas/DesktopOnboardingState" }
    DesktopOnboardingConflict:
      description: >-
        onboarding-revision-conflict, onboarding-flow-finished, onboarding-locked,
        onboarding-revision-exhausted, unsafe-onboarding-path, invalid-onboarding-file or onboarding-read-failed.
        A leftover writer lock is reported, not stolen.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/DesktopOnboardingError" }
    DesktopOnboardingUnavailable:
      description: onboarding-unavailable, onboarding-directory-unavailable or onboarding-write-failed
      content:
        application/json:
          schema: { $ref: "#/components/schemas/DesktopOnboardingError" }
  schemas:
    CompletedSubagentResponse:
      type: object
      required: [laneId, agent, task, taskIndex, sessionId, timestamp, output]
      properties:
        laneId: { type: string }
        agent: { type: string }
        task: { type: string }
        taskIndex: { type: integer, minimum: 0 }
        sessionId: { type: string }
        timestamp: { type: number, description: "Child answer completion time, epoch milliseconds" }
        output: { type: string, description: "Complete answer, or bounded preview with the full retained-output file path" }
        outputHash: { type: string, description: "SHA-256 of the unabridged trimmed answer; optional for old entries" }
    SubagentLaneSnapshot:
      type: object
      required: [laneId, status, details]
      properties:
        laneId: { type: string }
        status: { type: string, enum: [running, completed, failed, aborted] }
        details:
          type: object
          required: [mode, agentScope, userAgentsDir, projectAgentsDir, agentId, results]
          properties:
            mode: { type: string, enum: [single, parallel, chain] }
            agentScope: { type: string, enum: [user, project, both] }
            userAgentsDir: { type: string }
            projectAgentsDir: { type: [string, "null"] }
            agentId: { type: string, description: "Same identity as laneId" }
            status: { type: string, enum: [running, completed, failed, aborted] }
            startedAt: { type: number }
            updatedAt: { type: number }
            omittedResults: { type: integer, minimum: 0 }
            results:
              type: array
              description: Bounded replacement roster; no child transcript or accumulated completed answers.
              items:
                type: object
                required: [agent, agentSource, task, status, exitCode, messages, stderr, usage]
                properties:
                  agent: { type: string }
                  agentSource: { type: string, enum: [builtin, user, project, unknown] }
                  task: { type: string }
                  status: { type: string, enum: [queued, running, completed, failed, aborted, skipped] }
                  exitCode: { type: number }
                  messages: { type: array, maxItems: 0 }
                  stderr: { type: string }
                  sessionId: { type: string }
                  sessionFile: { type: string }
                  model: { type: string }
                  stopReason: { type: string }
                  errorMessage: { type: string }
                  activeText: { type: string }
                  activeTool: { type: string }
                  activeToolArgs: { type: string }
                  activeToolOutput: { type: string }
                  lastEvent: { type: string }
                  startedAt: { type: number }
                  updatedAt: { type: number }
                  step: { type: number }
                  worktreePath: { type: string }
                  worktreeBranch: { type: string }
                  pendingReply: { type: boolean }
                  cancelledPrompts: { type: array, items: { type: string } }
                  usage:
                    type: object
                    required: [input, output, cacheRead, cacheWrite, cost, contextTokens, turns]
                    properties:
                      input: { type: number, minimum: 0 }
                      output: { type: number, minimum: 0 }
                      cacheRead: { type: number, minimum: 0 }
                      cacheWrite: { type: number, minimum: 0 }
                      cost: { type: number, minimum: 0 }
                      contextTokens: { type: number, minimum: 0 }
                      turns: { type: number, minimum: 0 }
    MigrationId:
      type: string
      minLength: 1
      maxLength: 256
      pattern: '^[a-zA-Z0-9_-]+$'
    MigrationText:
      type: string
      minLength: 1
      maxLength: 512
      pattern: '^[^\x00-\x1f\x7f]+$'
    MigrationKind: { type: string, enum: [sessions, skills, mcp, rules] }
    MigrationSource: { type: string, enum: [claude-code, codex, workbuddy, qoder, shared, stepcode, plugin] }
    MigrationAction: { type: string, enum: [copy, import, create, append, replace, skip] }
    MigrationAcknowledgement: { type: string, enum: [rules-impact, scope-expansion, independent-copy, sensitive-values] }
    MigrationActivation: { type: string, enum: [history, disabled, next-resource-load, unchanged] }
    MigrationScope:
      oneOf:
        - type: object
          additionalProperties: false
          required: [kind]
          properties:
            kind: { type: string, const: global }
        - type: object
          additionalProperties: false
          required: [kind, cwd]
          properties:
            kind: { type: string, const: project }
            cwd:
              type: string
              minLength: 1
              maxLength: 4096
              pattern: '^[^\x00-\x1f\x7f]+$'
              description: Explicit existing absolute destination, canonicalized by Host and pinned by the service without adding it to source scans.
      discriminator: { propertyName: kind }
    MigrationTargetRequest:
      oneOf:
        - $ref: "#/components/schemas/MigrationScope"
        - type: object
          additionalProperties: false
          required: [kind, cwd, create]
          properties:
            kind: { type: string, const: project }
            cwd: { type: string, minLength: 1, maxLength: 4096 }
            create: { type: boolean, const: true }
    MigrationScanRequest:
      type: object
      additionalProperties: false
      properties:
        kinds: { type: array, maxItems: 5, items: { $ref: "#/components/schemas/MigrationKind" } }
        projectCwds:
          type: array
          maxItems: 30
          description: >-
            Explicit registered source projects; HTTP and service limit 30.
            Omission retains the service's previous choice; [] clears it.
            Paths are canonicalized, but choosing a project does not register it or grant trust.
          items: { type: string, minLength: 1, maxLength: 4096, pattern: '^[^\x00-\x1f\x7f]+$' }
        sessionOptions:
          type: object
          additionalProperties: false
          properties:
            range: { type: string, enum: [all, '7', '30', '90'], default: all, description: Source file modification-time window }
            limit: { type: [integer, 'null'], enum: [30, 50, 100, null], default: 100, description: Global candidate display limit; null does not remove safety limits }
            includeArchived: { type: boolean, default: false }
        mcpSourcePaths:
          type: object
          additionalProperties: false
          description: Explicit absolute MCP configuration files only; omission resets MCP sources to defaults, without affecting other scan roots.
          properties:
            claude-code: { type: string, minLength: 1, maxLength: 4096, pattern: '^[^\x00-\x1f\x7f]+$' }
            codex: { type: string, minLength: 1, maxLength: 4096, pattern: '^[^\x00-\x1f\x7f]+$' }
    MigrationPreviewRequest:
      type: object
      additionalProperties: false
      required: [candidateId]
      properties:
        candidateId: { $ref: "#/components/schemas/MigrationId" }
        target: { $ref: "#/components/schemas/MigrationTargetRequest" }
        action: { $ref: "#/components/schemas/MigrationAction" }
        targetName:
          type: string
          minLength: 1
          maxLength: 255
          pattern: '^[^\x00-\x1f\x7f]+$'
          description: >-
            Adapter limit 255; service resource names are at most 64 ASCII alphanumeric/underscore/hyphen
            starting alphanumeric, excluding __proto__, constructor and prototype. Skills require lowercase
            alphanumeric segments separated by hyphens. Rules may only name AGENTS.md. Sessions retain the
            source title.
        includeSensitiveValues:
          type: boolean
          default: true
          description: MCP headers, environment values and API keys migrate by default; false strips literals. OAuth is never migrated and DTO text stays redacted.
    MigrationError:
      type: object
      required: [error, code]
