        - migration-body-unreadable
        - migration-busy
        - migration-closed
        - migration-io-error
        - migration-lock-invalid
        - migration-lock-lost
        - migration-route-not-found
        - migration-unavailable
        - plan-expired
        - plan-limit
        - plan-not-found
        - plugin-managed
        - plugin-provided
        - preview-changed
        - preview-expired
        - preview-limit
        - preview-not-found
