    MigrationDiagnostic:
      type: object
      required: [code]
      properties:
        code: { $ref: "#/components/schemas/MigrationCode" }
        count: { type: number }
        path: { type: string, description: Safe path metadata, never configuration values or source text }
    MigrationCandidate:
      type: object
      required: [id, kind, source, name, sourcePath, sourceScope, holding, readiness, needsMigration, diagnostics]
      properties:
        id: { type: string, description: Opaque scanned identity; not an arbitrary file-read capability }
        kind: { $ref: "#/components/schemas/MigrationKind" }
        source: { $ref: "#/components/schemas/MigrationSource" }
        name: { type: string }
        sourcePath: { type: string }
        sourceScope: { $ref: "#/components/schemas/MigrationScope" }
        holding: { type: string, enum: [external, reference, stepcode, plugin] }
        readiness: { type: string, enum: [ready, disabled, shadowed, untrusted, unsupported, unknown] }
        needsMigration: { type: boolean, description: False for already configured, direct references and plugin-owned resources; do not auto-copy them }
        diagnostics: { type: array, items: { $ref: "#/components/schemas/MigrationDiagnostic" } }
        modified: { type: string }
        mcpTransport: { type: string, enum: [stdio, http], description: Safe connection type; never a command or URL }
        targetPath: { type: string, description: Rules only; the AGENTS.md a default preview writes. The preview target is authoritative }
        sourceSessionId: { type: string, description: Source metadata only }
        messageCount: { type: integer, minimum: 0, description: Non-empty source records found during discovery; never source content }
        messageCountCapped: { type: boolean, description: True when the count is a lower bound }
    MigrationSourceReport:
      type: object
      required: [kind, source, scope, path, status, diagnostics]
      properties:
        kind: { $ref: "#/components/schemas/MigrationKind" }
        source: { $ref: "#/components/schemas/MigrationSource" }
        scope: { $ref: "#/components/schemas/MigrationScope" }
        path: { type: string }
        status: { type: string, enum: [ok, missing, empty, partial, error, unsupported] }
        diagnostics: { type: array, items: { $ref: "#/components/schemas/MigrationDiagnostic" } }
    MigrationScanResult:
      type: object
      required: [candidates, sources, truncated]
      properties:
        candidates: { type: array, items: { $ref: "#/components/schemas/MigrationCandidate" } }
        sources: { type: array, items: { $ref: "#/components/schemas/MigrationSourceReport" } }
        truncated: { type: boolean, description: Non-session resource candidate limit reached (2000); session scanner has separate bounds }
    MigrationLocation:
      type: object
      required: [scope, path, name]
      properties:
        scope: { $ref: "#/components/schemas/MigrationScope" }
        path: { type: string, description: Host-resolved physical target, not a client-supplied write path }
        name: { type: string }
    MigrationRuleImpact:
      type: object
      required: [before, after, shadowed, fingerprint, backupRequired]
      properties:
        before: { type: array, items: { type: string }, description: Effective default-loader rule paths before the write }
        after: { type: array, items: { type: string }, description: Effective default-loader rule paths after the write }
        shadowed: { type: array, items: { type: string } }
        fingerprint: { type: string, description: Binds effective rule files and absent higher-priority candidates to consent }
        backupRequired: { type: boolean }
    MigrationPreview:
      type: object
      required: [id, candidate, fingerprint, expiresAt, target, action, allowedActions, sourceText, requiredAcknowledgements, warnings, blockers, activation]
      properties:
        id: { type: string }
        candidate: { $ref: "#/components/schemas/MigrationCandidate" }
        fingerprint: { type: string }
        expiresAt: { type: string, format: date-time }
        target: { $ref: "#/components/schemas/MigrationLocation" }
        action: { $ref: "#/components/schemas/MigrationAction" }
        allowedActions: { type: array, items: { $ref: "#/components/schemas/MigrationAction" } }
        sourceText: { type: string, description: Bounded excerpt/content; MCP declarations are always redacted }
        targetText: { type: string }
        resultText: { type: string }
        files:
          type: array
          items:
            type: object
            required: [path, bytes]
            properties:
              path: { type: string, description: Relative skill package file }
              bytes: { type: integer, minimum: 0 }
        ruleImpact: { $ref: "#/components/schemas/MigrationRuleImpact" }
        requiredAcknowledgements: { type: array, items: { $ref: "#/components/schemas/MigrationAcknowledgement" } }
        warnings: { type: array, items: { $ref: "#/components/schemas/MigrationDiagnostic" } }
        blockers: { type: array, items: { $ref: "#/components/schemas/MigrationDiagnostic" } }
        activation: { $ref: "#/components/schemas/MigrationActivation" }
    MigrationSelection:
      type: object
      additionalProperties: false
      required: [previewId, acknowledged]
      properties:
        previewId: { $ref: "#/components/schemas/MigrationId" }
        acknowledged: { type: array, maxItems: 4, items: { $ref: "#/components/schemas/MigrationAcknowledgement" } }
    MigrationPlan:
      type: object
      required: [id, digest, expiresAt, items]
      properties:
        id: { type: string }
        digest: { type: string }
        expiresAt: { type: string, format: date-time }
        items: { type: array, items: { $ref: "#/components/schemas/MigrationPreview" } }
    MigrationStartRequest:
      type: object
      additionalProperties: false
      required: [planId, digest, idempotencyKey]
      properties:
        planId: { $ref: "#/components/schemas/MigrationId" }
        digest: { $ref: "#/components/schemas/MigrationText" }
        idempotencyKey:
          type: string
          pattern: '^[a-zA-Z0-9_-]{1,128}$'
          description: Service limit 128 ASCII alphanumeric/underscore/hyphen (adapter text limit 512).
    LegacyMigrationKind:
      type: string
      enum: [sessions, skills, mcp, rules, prompts]
      description: Historical job results may contain prompts; current scans and previews accept only MigrationKind.
    MigrationItemResult:
      type: object
      required: [id, candidateId, kind, source, name, sourceScope, requestedTarget, action, status, diagnostics, activation]
      properties:
        id: { type: string }
        candidateId: { type: string }
        kind: { $ref: "#/components/schemas/LegacyMigrationKind" }
        source: { $ref: "#/components/schemas/MigrationSource" }
        name: { type: string }
        sourceScope: { $ref: "#/components/schemas/MigrationScope" }
        requestedTarget: { $ref: "#/components/schemas/MigrationLocation" }
        actualTarget: { $ref: "#/components/schemas/MigrationLocation" }
        action: { $ref: "#/components/schemas/MigrationAction" }
        status: { type: string, enum: [pending, running, imported, skipped, failed, not-run] }
        diagnostics: { type: array, items: { $ref: "#/components/schemas/MigrationDiagnostic" } }
        activation: { $ref: "#/components/schemas/MigrationActivation" }
        sessionId: { type: string }
        backupId: { type: string }
    MigrationJob:
      type: object
      required: [id, createdAt, revision, status, items]
      properties:
        id: { type: string }
        createdAt: { type: string, format: date-time }
        revision: { type: integer, minimum: 0 }
        status: { type: string, enum: [queued, running, stopping, completed, cancelled, interrupted] }
        items: { type: array, items: { $ref: "#/components/schemas/MigrationItemResult" } }
    MigrationRecoveryPreview:
      type: object
      required: [id, jobId, itemId, target, currentText, restoredText, expiresAt, requiredAcknowledgements, diagnostics]
      properties:
        id: { type: string }
        jobId: { type: string }
        itemId: { type: string }
        target: { $ref: "#/components/schemas/MigrationLocation" }
        currentText: { type: string }
        restoredText: { type: string }
        expiresAt: { type: string, format: date-time }
        requiredAcknowledgements: { type: array, items: { $ref: "#/components/schemas/MigrationAcknowledgement" } }
        diagnostics: { type: array, items: { $ref: "#/components/schemas/MigrationDiagnostic" } }
    DesktopOnboardingStatus: { type: string, enum: [unseen, offered, in_progress, completed, skipped] }
    DesktopOnboardingState:
      type: object
      required: [schemaVersion, flowVersion, revision, status, updatedAt]
      properties:
        schemaVersion: { type: integer, const: 1 }
        flowVersion: { type: integer, const: 1 }
        revision: { type: integer, minimum: 0, maximum: 9007199254740991 }
        status: { $ref: "#/components/schemas/DesktopOnboardingStatus" }
        lastJobId: { type: string, pattern: '^[a-zA-Z0-9_-]{1,128}$' }
        updatedAt: { type: string, format: date-time }
    DesktopOnboardingPatch:
      type: object
      additionalProperties: false
      required: [expectedRevision, status]
      properties:
        expectedRevision: { type: integer, minimum: 0, maximum: 9007199254740991 }
        status: { $ref: "#/components/schemas/DesktopOnboardingStatus" }
        lastJobId: { type: string, pattern: '^[a-zA-Z0-9_-]{1,128}$' }
    DesktopOnboardingError:
      type: object
      required: [error, code]
      properties:
        error: { $ref: "#/components/schemas/DesktopOnboardingErrorCode" }
        code: { $ref: "#/components/schemas/DesktopOnboardingErrorCode" }
    DesktopOnboardingErrorCode:
      type: string
      enum: [invalid-onboarding-data, invalid-onboarding-job-id, invalid-onboarding-path, unsafe-onboarding-path, onboarding-directory-unavailable, invalid-onboarding-file, onboarding-read-failed, onboarding-write-failed, onboarding-locked, onboarding-revision-conflict, onboarding-flow-finished, onboarding-revision-exhausted, onboarding-unavailable]
    ImportCandidate:
      type: object
      required: [id, source, sessionId, title, cwd, modified, archived, version]
      properties:
        id: { type: string }
        source: { type: string, enum: [codex, claude-code, workbuddy, qoder] }
        sessionId: { type: string }
        title:
          type: string
          description: Readable bounded scan title; explicit source title, first user text, or project/source plus ID fallback. Preview may refine a fallback.
        cwd: { type: string, description: Source project directory from discovered metadata }
        sourcePath: { type: string, description: Absolute source JSONL path on the host }
        modified: { type: string, format: date-time }
        archived: { type: boolean }
        version: { type: string }
    ImportPreview:
      allOf:
        - { $ref: "#/components/schemas/ImportCandidate" }
        - type: object
          required: [fingerprint, messageCount, toolCount, warnings, excerpt]
          properties:
            fingerprint: { type: string }
            messageCount: { type: integer }
            toolCount: { type: integer }
            excerpt: { type: string, maxLength: 12000 }
            warnings:
              type: array
              items:
                type: object
                required: [code, count]
                properties:
                  code: { type: string }
                  count: { type: integer }
    ImportJob:
      type: object
      required: [id, createdAt, status, total, results]
      properties:
        id: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        status: { type: string, enum: [running, completed, cancelled, interrupted] }
        total: { type: integer }
        results:
          type: array
          items:
            type: object
            required: [candidateId, status]
            properties:
              candidateId: { type: string }
              source: { type: string, enum: [codex, claude-code, workbuddy, qoder], description: Source client; legacy recovery uses validated provenance only }
              sourcePath: { type: string, description: Absolute source JSONL path on the host when known }
              title: { type: string, description: Reviewed title or bounded native-header recovery for older results; absent when unknown }
              cwd:
                type: string
                description: Selected absolute destination for imported, skipped or failed selections. Older results may recover native header cwd; absent when unknown or for batch-level journal failures.
              status: { type: string, enum: [imported, skipped, failed] }
              sessionId: { type: string }
              path: { type: string }
              error: { type: string }
              warning: { type: string, description: "Session publication succeeded, but a secondary notification failed" }
    TerminalInfo:
      type: object
      required: [id, cwd, title, shell, status, cols, rows]
      properties:
        id: { type: string }
        cwd: { type: string, description: Canonical (realpath) workspace folder; may differ from the requested spelling }
        title: { type: string, description: Workspace folder name, numbered when the folder already has terminals }
        shell: { type: string, description: Shell program name such as zsh or PowerShell }
        status: { type: string, enum: [starting, running, exited, failed] }
        cols: { type: integer, minimum: 2, maximum: 500 }
        rows: { type: integer, minimum: 1, maximum: 300 }
        pid: { type: integer, minimum: 1 }
        exitCode: { type: integer }
        error: { type: string }
    TerminalSnapshot:
      type: object
      required: [info, chunks, seq, truncated]
      properties:
        info: { $ref: "#/components/schemas/TerminalInfo" }
        seq: { type: integer, minimum: 0 }
        truncated: { type: boolean }
        chunks:
          type: array
          maxItems: 2048
          items:
            type: object
            required: [seq, data]
            properties:
              seq: { type: integer, minimum: 1 }
              data: { type: string, maxLength: 8192 }
    VoiceStatus:
      type: object
      required: [available]
      properties:
        available: { type: boolean }
        reason: { type: string, enum: [no-credential], description: Why dictation is unavailable }
        channel: { type: string, enum: [step_plan, platform], description: Which StepFun service the credential belongs to }
        keySource: { type: string, enum: [environment, auth.json], description: Where the credential comes from; never the key }
    ThinkingTimings:
      type: object
      description: Host-observed thinking intervals by original content-block index; absent for unobserved legacy history.
      additionalProperties:
        type: object
        required: [startedAt]
        properties:
          startedAt: { type: number, description: Host epoch milliseconds when thinking started streaming }
          endedAt: { type: number, description: Host epoch milliseconds when thinking stopped streaming }
    QueuedMessage:
      type: object
      required: [id, text, attachments, files]
      properties:
        id: { type: string }
        text: { type: string, description: The text as typed; file contents are added at dispatch }
        attachments:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              kind: { type: string, enum: [image, text] }
        files:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              name: { type: string }
    QueueState:
      type: object
      required: [queued, steering]
      properties:
        queued:
          type: array
          items: { $ref: "#/components/schemas/QueuedMessage" }
        steering:
          type: array
          items: { $ref: "#/components/schemas/SteeringMessage" }
    SteeringMessage:
      type: object
      description: A steered message the kernel has not delivered yet, with its images
      required: [text, images]
      properties:
        text: { type: string }
        images:
          type: array
          items:
            type: object
            required: [mimeType, data]
            properties:
              mimeType: { type: string }
              data: { type: string, description: Base64 image bytes }
    SessionRetry:
      type: object
      description: >-
        The kernel's automatic retry of a failed model request (`auto_retry_start`), present from the start event until
        `auto_retry_end` or the run settles. The live form arrives as `agent` SSE events.
      required: [attempt, maxAttempts, delayMs, startedAt, errorMessage]
      properties:
        attempt: { type: integer, description: 1-based attempt about to run }
        maxAttempts: { type: integer }
        delayMs: { type: integer, description: Backoff before the attempt starts }
        startedAt: { type: integer, description: Epoch milliseconds when the retry was scheduled }
        errorMessage: { type: string, description: The provider error that caused the retry }
        reason: { type: string, enum: [rate_limit] }
    SessionSearchHit:
      type: object
      required: [sessionId, cwd, entryId, ts, snippet]
      properties:
        sessionId: { type: string }
        cwd: { type: string }
        entryId:
          type: string
          nullable: true
          description: The matched entry; null for a title match or a hit from the degraded file scan.
        entryType: { type: string, description: "Entry type, or `session` for a title match" }
        role: { type: string, description: "`user` or `assistant` for message hits" }
        ts: { type: number, description: Epoch milliseconds of the entry }
        snippet: { type: string, description: Excerpt; each match is wrapped in U+0002 and U+0003 }
    McpServerConfig:
      description: "A server declaration as `config.toml` stores it: `command` for stdio, `url` for streamable HTTP."
      type: object
      properties:
        command: { type: string }
        args: { type: array, items: { type: string } }
        cwd: { type: string }
        env: { type: object, additionalProperties: { type: string } }
        url: { type: string }
        http_headers: { type: object, additionalProperties: { type: string } }
        bearer_token_env_var: { type: string }
        env_http_headers:
          description: Header name to the environment variable that holds its value.
          type: object
          additionalProperties: { type: string }
        startup_timeout_sec: { type: number }
        tool_timeout_sec: { type: number }
        enabled_tools:
          description: Allow list; when set, only these tools are reachable (an empty list allows none).
          type: array
          items: { type: string }
        disabled_tools: { type: array, items: { type: string } }
        shared: { type: boolean, description: "false gives every session its own connection instead of the shared one" }
        oauth:
          type: object
          properties:
            client_id: { type: string }
            client_secret: { type: string }
            scopes: { type: array, items: { type: string } }
            callback_port: { type: integer }
        enabled: { type: boolean }
    McpSettingsField:
      type: string
      enum: [command, args, cwd, env, url, bearer_token_env_var, http_headers, env_http_headers, enabled, startup_timeout_sec, tool_timeout_sec, enabled_tools, disabled_tools, shared, oauth]
    McpSettingsPatch:
      type: object
      additionalProperties: false
      required: [revision, fields]
      description: >-
        Full stored declaration hash, then explicit per-field intent. Unknown patch/field/change keys
        are rejected. Values are validated after applying changes under the config lock; the complete
        result must contain exactly one valid transport. Omitted or keep fields remain unchanged.
      properties:
        revision: { type: string, pattern: '^[a-f0-9]{64}$' }
        fields:
          type: object
          additionalProperties: false
          properties:
            command: { $ref: "#/components/schemas/McpStringChange" }
            args: { $ref: "#/components/schemas/McpStringListChange" }
            cwd: { $ref: "#/components/schemas/McpStringChange" }
            env: { $ref: "#/components/schemas/McpStringMapChange" }
            url: { $ref: "#/components/schemas/McpStringChange" }
            bearer_token_env_var: { $ref: "#/components/schemas/McpStringChange" }
            http_headers: { $ref: "#/components/schemas/McpStringMapChange" }
            env_http_headers: { $ref: "#/components/schemas/McpStringMapChange" }
            enabled: { $ref: "#/components/schemas/McpBooleanChange" }
            startup_timeout_sec: { $ref: "#/components/schemas/McpNumberChange" }
            tool_timeout_sec: { $ref: "#/components/schemas/McpNumberChange" }
            enabled_tools: { $ref: "#/components/schemas/McpStringListChange" }
            disabled_tools: { $ref: "#/components/schemas/McpStringListChange" }
            shared: { $ref: "#/components/schemas/McpBooleanChange" }
            oauth: { $ref: "#/components/schemas/McpOauthChange" }
    McpKeepOrRemove:
      type: object
      additionalProperties: false
      required: [operation]
      properties:
        operation: { type: string, enum: [keep, remove] }
    McpStringChange:
      oneOf:
        - { $ref: "#/components/schemas/McpKeepOrRemove" }
        - type: object
          additionalProperties: false
          required: [operation, value]
          properties:
            operation: { type: string, const: set }
            value: { type: string }
    McpStringListChange:
      oneOf:
        - { $ref: "#/components/schemas/McpKeepOrRemove" }
        - type: object
          additionalProperties: false
          required: [operation, value]
          properties:
            operation: { type: string, const: set }
            value: { type: array, items: { type: string } }
    McpStringMapChange:
      oneOf:
        - { $ref: "#/components/schemas/McpKeepOrRemove" }
        - type: object
          additionalProperties: false
          required: [operation, value]
          properties:
            operation: { type: string, const: set }
            value: { type: object, additionalProperties: { type: string } }
    McpBooleanChange:
      oneOf:
        - { $ref: "#/components/schemas/McpKeepOrRemove" }
        - type: object
          additionalProperties: false
          required: [operation, value]
          properties:
            operation: { type: string, const: set }
            value: { type: boolean }
    McpNumberChange:
      oneOf:
        - { $ref: "#/components/schemas/McpKeepOrRemove" }
        - type: object
          additionalProperties: false
          required: [operation, value]
          properties:
            operation: { type: string, const: set }
            value: { type: number, exclusiveMinimum: 0 }
    McpOauthChange:
      oneOf:
        - { $ref: "#/components/schemas/McpKeepOrRemove" }
        - type: object
          additionalProperties: false
          required: [operation, value]
          properties:
            operation: { type: string, const: set }
            value:
              type: object
              properties:
                client_id: { type: string }
                client_secret: { type: string, writeOnly: true }
                scopes: { type: array, items: { type: string } }
                callback_port: { type: integer, minimum: 1, maximum: 65535 }
    McpSafeConfig:
      type: object
      additionalProperties: false
      description: Read-only metadata projection, never a stored declaration to write back wholesale.
      properties:
        enabled: { type: boolean }
        shared: { type: boolean }
        startup_timeout_sec: { type: number, exclusiveMinimum: 0 }
        tool_timeout_sec: { type: number, exclusiveMinimum: 0 }
        enabled_tools: { type: array, items: { type: string } }
        disabled_tools: { type: array, items: { type: string } }
        bearer_token_env_var: { type: string, pattern: '^[A-Za-z_][A-Za-z0-9_]{0,127}$' }
        env_http_headers:
          type: object
          propertyNames: { pattern: '^[A-Za-z0-9_-]{1,128}$' }
          additionalProperties: { type: string, pattern: '^[A-Za-z_][A-Za-z0-9_]{0,127}$' }
    SettingsMcpServer:
      oneOf:
        - allOf:
            - { $ref: "#/components/schemas/SettingsMcpServerBase" }
            - type: object
              required: [source, config, protectedFields, revision]
              properties:
                source: { type: string, const: user }
                config: { $ref: "#/components/schemas/McpSafeConfig" }
                protectedFields: { type: array, items: { $ref: "#/components/schemas/McpSettingsField" } }
                revision: { type: string, pattern: '^[a-f0-9]{64}$' }
        - allOf:
            - { $ref: "#/components/schemas/SettingsMcpServerBase" }
            - type: object
              required: [source, pluginName]
              properties:
                source: { type: string, const: plugin }
                pluginName: { type: string }
      discriminator: { propertyName: source }
    SettingsMcpServerBase:
      type: object
      required: [name, transport, enabled]
      properties:
        name: { type: string }
        transport: { type: string, enum: [stdio, http] }
        enabled: { type: boolean }
        status: { type: string, enum: [connecting, connected, failed, disabled] }
        toolCount: { type: integer }
        error: { type: string, description: Generic safe connection diagnostic }
    SettingsMarketplace:
      type: object
      properties:
        name: { type: string }
        kind: { type: string, enum: [builtin, git, local] }
        origin: { type: string, nullable: true }
    SettingsSkill:
      type: object
      properties:
        id: { type: string, description: Absolute path of the skill file }
        name: { type: string }
        description: { type: string }
        source: { type: string, enum: [user, plugin] }
        pluginName: { type: string }
        location: { type: string, description: Display path, with the home directory shortened to `~` }
        enabled: { type: boolean }
        toggleable: { type: boolean }
        deletable: { type: boolean }
    ModelsJsonModelEntry:
      type: object
      description: >-
        One catalog entry of the models settings page: the fields `models.json` stores, plus
        `compactionThreshold`, which comes from the user's `config.toml`.
      required: [id]
      properties:
        id: { type: string }
        name: { type: string }
        contextWindow: { type: integer }
        maxTokens: { type: integer }
        input:
          type: array
          items: { type: string, enum: [text, image] }
        reasoning: { type: boolean, description: Whether the model takes a thinking effort }
        thinkingLevelMap:
          type: object
          description: >-
            Effort value sent for each thinking level; `null` hides the level. Keys are off, minimal, low,
            medium, high, xhigh and max.
          additionalProperties: { type: [string, "null"] }
        compactionThreshold:
          type: number
          minimum: 0.5
          maximum: 0.95
          description: >-
            Fraction of the context window that triggers automatic compaction for this model. Not stored in
            `models.json`: it is `compaction.modelTriggerRatios["<provider>/<id>"]` in the user's `config.toml`.
            Omitted (or blank on save) means the global `compaction.triggerRatio` applies.
    SettingsModelProvider:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        baseUrl: { type: string }
        api: { type: string }
        models:
          type: array
          items: { $ref: "#/components/schemas/ModelsJsonModelEntry" }
        credential:
          type: string
          enum: [stored, configured, none]
          description: Where the API key comes from; the key itself is never returned
    DiscoveredModel:
      type: object
      description: A model an endpoint advertises, as reported by its listing route.
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
        contextWindow: { type: integer }
        maxTokens: { type: integer }
    ApprovalRequest:
      type: object
      required: [id, sessionId, toolName, message, createdAt]
      properties:
        id: { type: string }
        sessionId: { type: string }
        toolName: { type: string }
        message: { type: string, description: Original confirmation diagnostics }
        reason: { type: string, description: Specific policy reason without call and batch diagnostics }
        createdAt: { type: number }
        input:
          type: object
          additionalProperties: true
          description: Full captured arguments for displaying the command without clipping
        preview:
          type: object
          properties:
            path: { type: string }
            before: { type: string }
            after: { type: string }
    PolicyPreset:
      type: object
      required: [id, label, description]
      properties:
        id: { type: string, enum: [ask, approve-for-me, full-access] }
        label: { type: string }
        description: { type: string }
    SelectionRequest:
      type: object
      required: [id, sessionId, title, options]
      description: >-
        A kernel `ui.select` question. `title` is "Title" or "Title\n\nmessage"; `options` are the kernel's labels,
        to be sent back verbatim.
      properties:
        id: { type: string }
        sessionId: { type: string }
        title: { type: string }
        options: { type: array, items: { type: string } }
    SideAnswer:
      type: object
      required: [id, question, text, createdAt]
      description: One `/btw` answer, shown in a rail tab.
      properties:
        id: { type: string }
        question: { type: string }
        text: { type: string, description: Markdown answer, or why there is none }
        model: { type: string }
        unavailable: { type: boolean, description: Cancelled, or no usable answer }
        createdAt: { type: integer }
    TextInputRequest:
      type: object
      required: [id, sessionId, title]
      description: >-
        A kernel `ui.input` prompt. The title and placeholder are the kernel's own wording; answer through
        `text-inputs/response`.
      properties:
        id: { type: string }
        sessionId: { type: string }
        title: { type: string }
        placeholder: { type: string }
    ClarificationRequest:
      type: object
      required: [id, sessionId, questions]
      properties:
        id: { type: string }
        sessionId: { type: string }
        questions:
          type: array
          items:
            type: object
            required: [id, label, question, options, allowFreeform]
            properties:
              id: { type: string }
              label: { type: string }
              question: { type: string }
              reason: { type: string }
              allowFreeform: { type: boolean }
              options:
                type: array
                items:
                  type: object
                  required: [label, value]
                  properties:
                    label: { type: string }
                    value: { type: string }
                    description: { type: string }
    LoginMethod:
      type: object
      required: [id, credentialSource, region, keyPageUrl]
      properties:
        id: { type: string, enum: [step_plan, step_plan_oversea, platform_cn, platform_oversea] }
        credentialSource: { type: string, enum: [browser, apiKey] }
        region: { type: string, enum: [cn, global] }
        keyPageUrl: { type: string, description: Where to create a platform API key }
    BrowserLoginState:
      type: object
      required: [state]
      properties:
        state: { type: string, enum: [idle, pending, completed, failed] }
        profile: { type: string }
        authUrl: { type: string, description: Authorize URL to open while pending }
        warning: { type: string, description: "Non-fatal account-session problem; the credential was saved" }
        error: { type: string }
    AccountReport:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ready, missing, expired, unavailable]
          description: |
            ready: `account` is set. missing: no account session (API-key sign-in).
            expired: the session was rejected; signing in again restores it.
            unavailable: the developer center could not be reached.
        account:
          type: object
          required: [name]
          properties:
            name: { type: string, description: "Nickname, else email, else the (masked) phone number" }
            avatarUrl: { type: string, format: uri }
            uid: { type: string, description: "Account id, as the developer center shows it" }
    LoginReport:
      description: |
        Where the model credential comes from. Never contains the credential.
        `configured` reports that one exists; `validity` reports what the
        provider said when it was checked.
      type: object
      required: [source, configured, session, loginCommand, planUrl]
      properties:
        source: { type: string, enum: [environment, auth.json, none] }
        provider: { type: string, description: "Provider id the credential belongs to" }
        profile: { type: string, description: "Login profile recorded at sign-in" }
        userId: { type: string, maxLength: 256, description: "Stored OAuth UID matching the kernel's valid checked account; omitted for environment keys or unknown identities" }
        path: { type: string, description: "Credential file, when one exists" }
        configured: { type: boolean, description: "A credential exists, whatever the provider said about it" }
        validity:
          type: string
          enum: [valid, invalid, unavailable, missing]
          description: "The provider's verdict; unavailable means it could not be reached"
        session:
          type: object
          required: [state]
          description: |
            The account session (`step-login.json`) beside the credential.
            Independent of `configured`: API-key sign-in leaves it `missing`, and
            an expired session never stops model requests.
          properties:
            state: { type: string, enum: [ready, expiring, expired, missing] }
            refreshExpiresAt: { type: integer, description: "Unix seconds when renewal is no longer possible" }
        loginCommand: { type: string, description: "The command that changes this state" }
        planUrl:
          type: string
          format: uri
          description: |
            Step Plan page of the credential's platform, where Upgrade leads:
            platform.stepfun.ai for an overseas plan or key, platform.stepfun.com
            otherwise (also when the region is unknown).
    StepLogoutReport:
      type: object
      required: [removed, accountSessionRemoved, remainingSource, customModels, login]
      properties:
        removed: { type: boolean, description: "A stored Step credential or legacy copy was removed" }
        accountSessionRemoved: { type: boolean, description: "`step-login.json` is gone from disk" }
        remainingSource:
          type: string
          enum: [environment]
          nullable: true
          description: "`environment` when STEP_API_KEY still authorizes requests; null otherwise"
        customModels: { type: boolean, description: "A custom models.json model is still usable, so the page stays in the app instead of the sign-in gate" }
        login: { $ref: "#/components/schemas/LoginReport" }
  parameters:
    MigrationJobId:
      name: jobId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/MigrationId" }
    SessionId:
      name: id
      in: path
      required: true
      schema: { type: string }
