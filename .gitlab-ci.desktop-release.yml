# StepCode Desktop releases: tag creation, the Windows installer of a release,
# and the uploads to TOS. See the header of .gitlab-ci.yml for the flow; the mac
# installers of a release come from .gitlab-ci.desktop-macos-signing.yml.
#
# A release is one pipeline: Run pipeline with DESKTOP_BUMP on the release
# branch. desktop_tag_release pushes the tag (without a pipeline of its own) and
# passes DESKTOP_TAG / DESKTOP_VERSION to the release jobs as a dotenv report.
# Running a pipeline on an existing desktop-v* tag repeats that release from
# the tag (version from CI_COMMIT_TAG). Every release job carries the same two
# rules, `.desktop-release-rules`; keep .stepcode-macos-signing-rules in step.
#
# Bucket layout (prefix STEP_TOS_PREFIX), written by infra/release/desktop-release.mjs:
#   desktop/<v>/StepCode-<v>-mac-arm64.dmg   immutable, Developer ID signed + notarized
#   desktop/<v>/StepCode-<v>-mac-x64.dmg     immutable, Developer ID signed + notarized
#   desktop/<v>/StepCode-<v>-mac-<arch>.zip  immutable, the same stapled apps: in-app update payloads
#   desktop/<v>/StepCode-<v>-win-x64.exe     immutable, Authenticode signed (GlobalSign EV);
#                                            only with DESKTOP_RELEASE_WINDOWS=true
#   desktop/<v>/SHA256SUMS, manifest.json    immutable
#   desktop/latest.json                      channel pointer, uploaded last; also the in-app
#                                            update channel the packaged app reads (electron-updater)

variables:
  RELEASE_BUILDER_IMAGE: 'hub.stepfun-inc.com/aiagent/step-cli/release-builder@sha256:c6538968b0f1d223b02016bf1689c35a6b26d6945fb273629ce66d1f3e36a7fc'
  STEP_RELEASE_BASE_URL: 'https://capy-public-dev.tos-cn-shanghai.volces.com/stepcode'
  STEP_RELEASE_PROD_BASE_URL: 'https://static-openapi.stepfun.com/stepcode'
  STEP_TOS_PROD_BUCKET: 'devcenter-web-cn-prod'
  STEP_TOS_PROD_ENDPOINT: 'tos-cn-shanghai.ivolces.com'
  # Windows in releases: off while the Windows packager (runner tags windows +
  # bare-metal) cannot run jobs, so a release is macOS only and never waits on
  # it. Set to 'true' (here, or in the Run pipeline form) to build, EV-sign and
  # publish the Windows installer again. The uploads follow it: without Windows
  # the release's latest.json lists only the mac assets, and Windows clients
  # (none yet) see no update.
  DESKTOP_RELEASE_WINDOWS: 'false'

# Docker jobs: no falcon toolchain, so the global falcon before_script is off.
.desktop-docker-job:
  image: '$RELEASE_BUILDER_IMAGE'
  tags:
    - docker
  before_script: []
  cache:
    key: 'desktop-pnpm-$CI_COMMIT_REF_SLUG'
    paths:
      - node_modules/
    policy: pull-push

.desktop-release-rules:
  rules:
    - if: '$DESKTOP_BUMP != "none" && $CI_COMMIT_BRANCH && ($CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_BRANCH == $DESKTOP_RELEASE_BRANCH) && ($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api" || $CI_PIPELINE_SOURCE == "trigger")'
    - if: '$CI_COMMIT_TAG =~ /^desktop-v\d+\.\d+\.\d+$/'
    - when: never

# The version of a release pipeline comes only from its tag: the one
# desktop_tag_release just pushed (dotenv), or the tag the pipeline runs on.
.desktop-release-version:
  script:
    - |
      if [ -z "${DESKTOP_TAG:-}" ]; then DESKTOP_TAG="${CI_COMMIT_TAG:-}"; fi
      if [ -z "${DESKTOP_TAG}" ] || ! printf '%s' "$DESKTOP_TAG" | grep -Eq '^desktop-v[0-9]+\.[0-9]+\.[0-9]+$'; then
        echo "This job releases StepCode Desktop and needs a desktop-vX.Y.Z tag (from desktop_tag_release or the pipeline ref), not '${DESKTOP_TAG}'." >&2
        exit 1
      fi
      export DESKTOP_TAG
      export DESKTOP_VERSION="${DESKTOP_TAG#desktop-v}"
      export STEPCODE_BUILD_VERSION="$DESKTOP_VERSION"
      export STEPCODE_BUILD_COMMIT="$CI_COMMIT_SHA"
      # In-app update channel baked into the installers (apps/desktop/scripts/package.mjs).
      # Always production: the test bucket holds the same bytes, and a tester points an
      # installed app elsewhere with STEPCODE_DESKTOP_UPDATE_URL.
      export STEPCODE_UPDATE_URL="${STEPCODE_UPDATE_URL:-${STEP_RELEASE_PROD_BASE_URL}/desktop/}"
      echo "StepCode Desktop version: $DESKTOP_VERSION, update channel $STEPCODE_UPDATE_URL"

# Release-script tests and the desktop typecheck, before a tag is created and
# before a release is uploaded.
desktop_check:
  stage: verify
  extends:
    - .desktop-docker-job
    - .desktop-release-rules
  script:
    - pnpm install --frozen-lockfile --ignore-scripts
    - node --test scripts/desktop-release.test.mjs
    - pnpm --filter @step-harness/desktop typecheck

desktop_tag_release:
  extends: .desktop-docker-job
  stage: tag
  needs: [desktop_check]
  cache: []
  rules:
    - if: '$DESKTOP_BUMP != "none" && $CI_COMMIT_BRANCH && ($CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_BRANCH == $DESKTOP_RELEASE_BRANCH) && ($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api" || $CI_PIPELINE_SOURCE == "trigger")'
    - when: never
  script:
    - |
      if [ -z "${STEP_RELEASE_TOKEN:-}" ]; then
        echo "STEP_RELEASE_TOKEN is not set: it is a protected variable, so the branch must be protected." >&2
        echo "It needs the api and write_repository scopes and may create the protected desktop-v* tags." >&2
        exit 1
      fi
    # No dependencies: the script only talks to the GitLab API and git.
    - node infra/release/desktop-tag-release.mjs --bump "$DESKTOP_BUMP" --dotenv desktop.env
  artifacts:
    reports:
      dotenv: desktop.env

# Same cross-build as stepcode-desktop-package-windows, without falcon: a
# release names its version from the tag and needs no falcon collection.
# The Windows installer of a release, built and signed on the Windows packager
# that holds the company's GlobalSign EV USB token (runner tags windows +
# bare-metal; shared with catalyst/stepfun-desktop, enabled for this project).
# It is a persistent shell runner (Git Bash, Node and pnpm installed), so:
#   - no image; the falcon before_script stays off;
#   - pnpm install goes through powershell.exe: Git Bash pnpm writes POSIX
#     junctions that electron-builder then fails to stat;
#   - GIT_CLEAN_FLAGS without -x keeps node_modules warm between runs;
#   - the runner's pre_get_sources_script drops the largest variables to stay
#     under the MSYS exec limit (CSC_LINK is the first to go; Windows never uses
#     it, pack-win strips certificate variables anyway).
# pack-win --sign probes the token first, signs every PE file (app, helpers,
# server tree, installer, uninstaller) and verifies the result with signtool.
# The token signs one thing at a time: a stepfun-desktop pipeline signing at the
# same moment makes the probe time out, and a retry is the remedy (the
# resource_group below only serialises this project's own runs).
stepcode-desktop-release-windows:
  stage: package
  tags:
    - mobile
    - online
    - windows
    - bare-metal
  needs:
    - job: desktop_tag_release
      artifacts: true
      optional: true
  resource_group: stepcode-windows-packer
  timeout: 150 minutes
  interruptible: false
  before_script: []
  variables:
    GIT_CLEAN_FLAGS: '-ffd'
    GIT_DEPTH: '20'
    # The runner helper's Go net/http has hit TLS handshake timeouts uploading
    # artifacts from this machine; HTTP/1.1 avoids them.
    GODEBUG: 'http2client=0'
    ELECTRON_MIRROR: 'https://npmmirror.com/mirrors/electron/'
    ELECTRON_BUILDER_BINARIES_MIRROR: 'https://npmmirror.com/mirrors/electron-builder-binaries/'
  rules:
    - if: '$DESKTOP_RELEASE_WINDOWS != "true"'
      when: never
    - !reference [.desktop-release-rules, rules]
  script:
    - !reference [.desktop-release-version, script]
    - node --version
    # No --ignore-scripts: node-pty and esbuild build their binaries in postinstall.
    - |
      workdir="$(cygpath -w "${CI_PROJECT_DIR}")"
      powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "Set-Location -LiteralPath '${workdir}'; pnpm install --frozen-lockfile --config.confirmModulesPurge=false; exit \$LASTEXITCODE"
    - node scripts/pack-win.cjs --env=prod --sign
    # The structural half of the check (metadata, payload version, a certificate
    # table that is not Apple's); signtool already verified the chain in pack-win.
    - node scripts/verify-win-artifact.mjs --signed --unpacked="$(ls -d apps/desktop/release/*/win-unpacked | head -1)"
  artifacts:
    name: 'stepcode-desktop-windows-$CI_PIPELINE_IID'
    paths:
      - dist-electron/*.exe
      - dist-electron/latest.yml
    expire_in: 2 weeks

# Stages the installers the release jobs built and uploads them. Only
# manifest.json and latest.json differ per environment (they carry its base URL).
.desktop-upload:
  extends: .desktop-docker-job
  stage: publish
  interruptible: false
  script:
    - !reference [.desktop-release-version, script]
    - pnpm install --frozen-lockfile --ignore-scripts
    - |
      if [ "${DESKTOP_RELEASE_WINDOWS:-false}" = "true" ]; then
        # Nothing unsigned reaches a bucket: the Windows installer must carry the EV
        # signature (the mac dmgs were checked by codesign/spctl in their finalize jobs).
        node scripts/verify-win-artifact.mjs --signed
        export DESKTOP_PLATFORMS="darwin,win32"
      else
        echo "Windows is held back from this release (DESKTOP_RELEASE_WINDOWS=${DESKTOP_RELEASE_WINDOWS:-false}): macOS only."
        export DESKTOP_PLATFORMS="darwin"
      fi
      node infra/release/desktop-release.mjs --version "$DESKTOP_VERSION" --base-url "$DESKTOP_BASE_URL" --input dist-electron --platforms "$DESKTOP_PLATFORMS" --upload
    - echo "Channel $DESKTOP_BASE_URL/desktop/latest.json now names StepCode Desktop $DESKTOP_VERSION"
  artifacts:
    paths:
      - dist/release/desktop/*/manifest.json
      - dist/release/desktop/*/SHA256SUMS
      - dist/release/desktop/latest.json
    expire_in: 2 weeks

desktop_upload_test:
  extends: .desktop-upload
  needs:
    - job: desktop_check
      artifacts: false
    - job: desktop_tag_release
      artifacts: true
      optional: true
    - job: stepcode-desktop-notary-finalize-arm64
      artifacts: true
    - job: stepcode-desktop-notary-finalize-x64
      artifacts: true
    # Optional: absent when DESKTOP_RELEASE_WINDOWS is off.
    - job: stepcode-desktop-release-windows
      artifacts: true
      optional: true
  # Automatic: once every installer is built (and the mac ones notarized), the
  # test bucket gets the release.
  rules: !reference [.desktop-release-rules, rules]
  variables:
    DESKTOP_BASE_URL: '$STEP_RELEASE_BASE_URL'

desktop_upload_prod:
  extends: .desktop-upload
  needs:
    - job: desktop_tag_release
      artifacts: true
      optional: true
    - job: stepcode-desktop-notary-finalize-arm64
      artifacts: true
    - job: stepcode-desktop-notary-finalize-x64
      artifacts: true
    # Optional: absent when DESKTOP_RELEASE_WINDOWS is off.
    - job: stepcode-desktop-release-windows
      artifacts: true
      optional: true
    - job: desktop_upload_test
      artifacts: false
  # Manual: production users see a release only after someone checked the test
  # bucket's installers.
  rules:
    - if: '$DESKTOP_BUMP != "none" && $CI_COMMIT_BRANCH && ($CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_BRANCH == $DESKTOP_RELEASE_BRANCH) && ($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api" || $CI_PIPELINE_SOURCE == "trigger")'
      when: manual
    - if: '$CI_COMMIT_TAG =~ /^desktop-v\d+\.\d+\.\d+$/'
      when: manual
    - when: never
  variables:
    DESKTOP_BASE_URL: '$STEP_RELEASE_PROD_BASE_URL'
  before_script:
    - |
      if [ -z "${STEP_TOS_PROD_ACCESS_KEY:-}" ] || [ -z "${STEP_TOS_PROD_SECRET_KEY:-}" ]; then
        echo "STEP_TOS_PROD_ACCESS_KEY and STEP_TOS_PROD_SECRET_KEY are required." >&2
        exit 1
      fi
    - export STEP_TOS_BUCKET="$STEP_TOS_PROD_BUCKET"
    - export STEP_TOS_ENDPOINT="$STEP_TOS_PROD_ENDPOINT"
    - export STEP_TOS_ACCESS_KEY="$STEP_TOS_PROD_ACCESS_KEY"
    - export STEP_TOS_SECRET_KEY="$STEP_TOS_PROD_SECRET_KEY"
