# Windows installer (NSIS) for StepCode Desktop: `pnpm pack:win`.
#
# falcon's windows_build.sh maps the profile to pack-win's flags (fast →
# --env=sit --no-sign; qa → --env=sit --sign; release → --env=prod --sign) and
# runs `node scripts/pack-win.cjs`, which leaves dist-electron/
# StepCode-<version>-win-x64.exe plus latest.yml and channel-artifacts.json.
# collect_windows_artifacts() then walks that manifest, renames the installer
# into build/ci/ with the build number in the name, rewrites the paths inside
# latest.yml to match, and records CI_WIN_EXE_PATH and friends.
#
# Only fast (unsigned) is offered: qa and release sign the installer with an EV
# token from build/tools/win/signing/ and Vault, which is not wired up yet (the
# release-tag installer is unsigned for the same reason). pack-win.cjs
# itself fails on --sign rather than shipping an unsigned installer under a
# signed profile's name.
#
# This runs on the macOS Tart runner as a cross-build: electron-builder's
# nsis target is platform independent, and this repo's packer is only
# electron-builder (no Rust/Tauri installer, no EV token), so no Windows box is
# needed to produce an unsigned installer. It was built and collected locally on
# macOS through this exact chain before this job existed.
#
# No runner of this project carries [mobile, online, windows, bare-metal] today.
# Move this job back to that box — tags + drop the image — when signing lands:
# signtool and the EV USB token only exist on Windows, and only there can the
# installer be run. pnpm on that box must go through falcon's run_pnpm.sh so
# node_modules gets Win32 junctions instead of MSYS ones; on macOS it is a pass
# through to plain pnpm, so the same script line serves both.
stepcode-desktop-package-windows:
  stage: package
  image: 'hub.i.basemind.com/fe/mobile/sequoia-xcode-26.0.1:latest'
  tags:
    - mobile
    - online
    - macos
    - tart
  needs: []
  # One installer run at a time: two Electron/NSIS builds on the same box contend
  # for disk and the workspace, and the staging directory outside the repo is
  # per-pipeline but the machine is not.
  resource_group: stepcode-windows-packer
  # Cold pnpm install plus two electron-builder passes; well below the project
  # default of 240 minutes so a hung job still fails while someone is watching.
  timeout: 150 minutes
  # after_script does not run for a cancelled job, which would leave the ~1.4GB
  # staging directory behind for the next run to garbage-collect.
  interruptible: false
  variables:
    # Keep gitignored node_modules (a warm install) but still remove untracked
    # nested repos, including the ./pipeline clone falcon makes every job.
    # GitLab's default -ffdx would delete node_modules too.
    GIT_CLEAN_FLAGS: '-ffd'
    GIT_DEPTH: '20'
    # The Windows helper's Go net/http has hit TLS handshake timeouts uploading
    # artifacts after a successful pack; harmless on the mac runner.
    GODEBUG: 'http2client=0'
    CI_NEEDS_GIT_PREP: '0'
    CI_NEEDS_GEM_PREP: '0'
    # Git Bash `pnpm install` writes POSIX-target junctions that electron-builder
    # then ENOENTs on, so the install goes through run_pnpm.sh below instead of
    # falcon's preparation.
    CI_NEEDS_NPM_PREP: '0'
    ELECTRON_MIRROR: 'https://npmmirror.com/mirrors/electron/'
    ELECTRON_BUILDER_BINARIES_MIRROR: 'https://npmmirror.com/mirrors/electron-builder-binaries/'
    # Falcon stages the collected installers outside the workspace by default:
    # they must survive `git clean` and are ~150MB per installer. This ad-hoc
    # build is not uploaded anywhere (releases upload through desktop_upload_*),
    # so the installer has to be a job artifact — point the staging root inside
    # build/ (gitignored) to make it downloadable.
    CI_WIN_STAGING_ROOT: '$CI_PROJECT_DIR/build/desktop-staging'
  rules:
    # A tag-creating run is not a packaging run; release tags package Windows in
    # stepcode-desktop-release-windows (.gitlab-ci.desktop-release.yml).
    - if: '$DESKTOP_BUMP != "none"'
      when: never
    - if: '$TASK_TYPE == "package" && $BUILD_PLATFORM == "windows" && $BUILD_PROFILE == "fast" && ($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api" || $CI_PIPELINE_SOURCE == "trigger")'
      when: always
    - when: never
  script:
    - !reference [.scripts, initial-env]
    # Fails fast before any install: Git Bash path conversion and, for a signed
    # profile, the EV token. Unsigned here, so only the path probe runs. The
    # falcon scripts are not mode 755 in git, so invoke them through bash.
    # Same ESM shadow as on macOS: the falcon clone sits inside this repo, whose
    # root package.json is "type": "module", so falcon's CommonJS helper that
    # reads the product name/version fails. Mark the clone as CommonJS.
    - |
      printf '{"type": "commonjs"}\n' > "${PIPELINE_TOOLCHAIN_DIR}/package.json"
    # falcon's scripts are checked out 100644, and windows_preflight.sh and
    # windows_build.sh invoke their siblings directly (windows_path_probe.sh,
    # windows_token_check.sh). Git Bash on Windows runs them anyway; a POSIX
    # runner answers "Permission denied". Mark the clone's scripts executable.
    - find "${PIPELINE_TOOLCHAIN_DIR}/scripts" -name '*.sh' -exec chmod +x {} +
    - bash "${BUILD_SCRIPT_DIR}/package/windows_preflight.sh"
    - bash "${BUILD_SCRIPT_DIR}/common/run_pnpm.sh" install --frozen-lockfile
    # resolve_windows_package_args → pack-win flags, then `node scripts/pack-win.cjs`.
    - bash "${BUILD_SCRIPT_DIR}/package/windows_build.sh"
    # No Windows machine here, so the installer cannot be run: check that the bytes
    # are a real PE image and that latest.yml/channel-artifacts.json describe the
    # file that exists. A rename or a stale yml is otherwise a 404 for the user and
    # a green pipeline for us.
    - node scripts/verify-win-artifact.mjs
  after_script:
    - !reference [.scripts, import-ci-env]
    - bash "${BUILD_SCRIPT_DIR}/package/archive_job_artifacts.sh"
  artifacts:
    name: 'stepcode-desktop-windows-$CI_PIPELINE_IID'
    paths:
      - build_archive/
      - build/ci/ci.env
      - build/ci/build_internal.env
      # The installer and its updater metadata, as falcon's collect step staged
      # them (renamed with the build number, latest.yml rewritten to match).
      - build/desktop-staging/
      - build/ci/channel-artifacts.json
      # electron-builder's own output name, independent of falcon's rename.
      - dist-electron/*.exe
      - dist-electron/latest.yml
    expire_in: 2 weeks
    when: always
