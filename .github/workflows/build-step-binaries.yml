name: Build Step Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Step tag to build (e.g., v0.3.1)'
        required: true
        type: string
      source_ref:
        description: 'Source ref to build (defaults to tag; use only for recovery)'
        required: false
        type: string

permissions: {}

concurrency:
  group: build-step-binaries-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
      SOURCE_REF: ${{ github.event.inputs.source_ref || github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Validate Step tag
        run: |
          set -euo pipefail
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Step workflow requires a tag named vX.Y.Z; got ${RELEASE_TAG}"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_REF }}
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Hydrate release model data
        run: npm run hydrate:model-data

      - name: Create source archive
        run: |
          set -euo pipefail

          VERSION="${RELEASE_TAG#v}"
          mkdir -p release-assets
          ./scripts/create-source-archive.sh \
            --version "${VERSION}" \
            --ref HEAD \
            --out "release-assets/step-${VERSION}-source.tar.gz"

      - name: Build Step binaries from source archive
        run: |
          set -euo pipefail

          VERSION="${RELEASE_TAG#v}"
          build_root="$(mktemp -d)"
          trap 'rm -rf "${build_root}"' EXIT
          tar -xzf "release-assets/step-${VERSION}-source.tar.gz" -C "${build_root}"
          STEP_CLI_BUILD_VERSION="${VERSION}" \
          STEP_CLI_BUILD_CHANNEL="release" \
          STEP_CLI_BUILD_COMMIT="${GITHUB_SHA:0:12}" \
          "${build_root}/step-${VERSION}/scripts/build-binaries.sh" \
            --product step \
            --offline-model-data \
            --out "${GITHUB_WORKSPACE}/packages/coding-agent/binaries"

      - name: Prepare Step release payload
        run: |
          set -euo pipefail

          VERSION="${RELEASE_TAG#v}"
          node scripts/release-notes.mjs extract \
            --version "${VERSION}" \
            --tag "${RELEASE_TAG}" \
            --out release-assets/RELEASE_NOTES.md

          cd packages/coding-agent/binaries
          binary_assets=(
            step-darwin-arm64.tar.gz
            step-darwin-x64.tar.gz
            step-linux-x64.tar.gz
            step-linux-arm64.tar.gz
            step-windows-x64.zip
            step-windows-arm64.zip
          )
          for asset in "${binary_assets[@]}"; do
            test -f "${asset}"
          done
          cp "${binary_assets[@]}" "${GITHUB_WORKSPACE}/release-assets/"

          cd "${GITHUB_WORKSPACE}/release-assets"
          source_asset="step-${VERSION}-source.tar.gz"
          release_assets=(
            "${source_asset}"
            step-darwin-arm64.tar.gz
            step-darwin-x64.tar.gz
            step-linux-x64.tar.gz
            step-linux-arm64.tar.gz
            step-windows-x64.zip
            step-windows-arm64.zip
            RELEASE_NOTES.md
          )
          sha256sum "${release_assets[@]}" > SHA256SUMS

      - name: Upload Step release payload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: step-release-assets-${{ env.RELEASE_TAG }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  smoke-test-binaries:
    runs-on: ${{ matrix.runner }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    permissions:
      actions: read
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Download Step binary archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: step-release-assets-${{ env.RELEASE_TAG }}
          path: release-assets

      - name: Extract current-platform Step binary
        id: binary
        shell: bash
        run: |
          set -euo pipefail

          runtime_platform="$(node -p '`${process.platform}-${process.arch}`')"
          case "${runtime_platform}" in
            darwin-arm64|darwin-x64|linux-arm64|linux-x64)
              platform="${runtime_platform}"
              archive="release-assets/step-${platform}.tar.gz"
              root="extracted/step"
              binary="${root}/step"
              ;;
            win32-arm64)
              platform="windows-arm64"
              archive="release-assets/step-${platform}.zip"
              root="extracted"
              binary="${root}/step.exe"
              ;;
            win32-x64)
              platform="windows-x64"
              archive="release-assets/step-${platform}.zip"
              root="extracted"
              binary="${root}/step.exe"
              ;;
            *)
              echo "::error::Unsupported runner platform ${runtime_platform}"
              exit 1
              ;;
          esac

          mkdir -p extracted
          if [[ "${archive}" == *.zip ]]; then
            export ARCHIVE_PATH="$(cygpath -w "${archive}")"
            export DESTINATION_PATH="$(cygpath -w extracted)"
            powershell.exe -NoProfile -NonInteractive -Command \
              'Expand-Archive -LiteralPath $env:ARCHIVE_PATH -DestinationPath $env:DESTINATION_PATH -Force'
          else
            tar -xf "${archive}" -C extracted
          fi
          echo "binary=${binary}" >> "${GITHUB_OUTPUT}"

      - name: Smoke-test Step binary
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          "${{ steps.binary.outputs.binary }}" --help
          test "$("${{ steps.binary.outputs.binary }}" --version)" = "${VERSION}"

  stage-github-release:
    runs-on: ubuntu-latest
    needs:
      - build
      - smoke-test-binaries
    permissions:
      actions: read
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Download Step release payload
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: step-release-assets-${{ env.RELEASE_TAG }}
          path: release-assets

      - name: Validate Step release payload
        run: |
          set -euo pipefail
          cd release-assets
          VERSION="${RELEASE_TAG#v}"
          expected_assets=(
            "step-${VERSION}-source.tar.gz"
            step-darwin-arm64.tar.gz
            step-darwin-x64.tar.gz
            step-linux-x64.tar.gz
            step-linux-arm64.tar.gz
            step-windows-x64.zip
            step-windows-arm64.zip
            SHA256SUMS
            RELEASE_NOTES.md
          )
          for asset in "${expected_assets[@]}"; do test -f "${asset}"; done
          sha256sum -c SHA256SUMS

      - name: Create draft Step GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd release-assets
          VERSION="${RELEASE_TAG#v}"
          release_assets=(
            "step-${VERSION}-source.tar.gz"
            step-darwin-arm64.tar.gz
            step-darwin-x64.tar.gz
            step-linux-x64.tar.gz
            step-linux-arm64.tar.gz
            step-windows-x64.zip
            step-windows-arm64.zip
            SHA256SUMS
          )
          existing_release="$(gh release view "${RELEASE_TAG}" --json isDraft --jq .isDraft 2>/dev/null || true)"
          if [[ "${existing_release}" == "false" ]]; then
            echo "::error::GitHub Release ${RELEASE_TAG} is already published."
            exit 1
          fi
          if [[ "${existing_release}" == "true" ]]; then gh release delete "${RELEASE_TAG}" --yes; fi
          gh release create "${RELEASE_TAG}" \
            --verify-tag \
            --draft \
            --title "${RELEASE_TAG}" \
            --notes-file RELEASE_NOTES.md \
            "${release_assets[@]}"

  publish-github-release:
    runs-on: ubuntu-latest
    needs: stage-github-release
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Publish Step GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          existing_release="$(gh release view "${RELEASE_TAG}" --json isDraft --jq .isDraft 2>/dev/null || true)"
          if [[ "${existing_release}" != "true" ]]; then
            echo "::error::Draft Step GitHub Release ${RELEASE_TAG} does not exist."
            exit 1
          fi
          gh release edit "${RELEASE_TAG}" --draft=false

  cleanup-draft-github-release:
    runs-on: ubuntu-latest
    needs:
      - build
      - stage-github-release
      - publish-github-release
    if: ${{ always() && needs.stage-github-release.result != 'skipped' && (needs.stage-github-release.result != 'success' || needs.publish-github-release.result != 'success') }}
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Delete draft Step GitHub Release after failure
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          existing_release="$(gh release view "${RELEASE_TAG}" --json isDraft --jq .isDraft 2>/dev/null || true)"
          if [[ "${existing_release}" == "true" ]]; then gh release delete "${RELEASE_TAG}" --yes; fi
