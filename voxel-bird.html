<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>像素风小鸟 · 骑自行车(极简体素)</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #eef1f5; }
  #hint {
    position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
    font: 13px/1.5 -apple-system, "PingFang SC", system-ui, sans-serif;
    color: #5a6b7b; background: rgba(255,255,255,.7);
    padding: 6px 14px; border-radius: 999px; pointer-events: none;
    box-shadow: 0 2px 10px rgba(0,0,0,.06);
  }
  #hint b { color: #2b3946; font-weight: 600; }
</style>
</head>
<body>
<div id="hint">拖动 <b>旋转</b> · 滚轮 <b>缩放</b> · 右键 <b>平移</b></div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ---------- 场景 ----------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xeef1f5);

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 100);
camera.position.set(16, 9, 19);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(1.5, 6.5, 0);

// ---------- 柔和打光 ----------
scene.add(new THREE.HemisphereLight(0xffffff, 0xdfe6ee, 1.05));
const keyLight = new THREE.DirectionalLight(0xffffff, 1.05);
keyLight.position.set(8, 16, 10);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.near = 1; keyLight.shadow.camera.far = 60;
keyLight.shadow.camera.left = -20; keyLight.shadow.camera.right = 20;
keyLight.shadow.camera.top = 20; keyLight.shadow.camera.bottom = -20;
keyLight.shadow.bias = -0.0005;
scene.add(keyLight);
const fillLight = new THREE.DirectionalLight(0xffffff, 0.35);
fillLight.position.set(-10, 5, 7);
scene.add(fillLight);

// ---------- 地面 ----------
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(24, 48),
  new THREE.ShadowMaterial({ opacity: 0.16 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.5;   // 车轮底(y=0 的方块底面)落在地面
ground.receiveShadow = true;
scene.add(ground);

// ---------- 调色板 ----------
const C = {
  white: 0xf7f7f2, // 身体
  beak:  0xf39c12, // 喙 橙
  eye:   0x1a1a1a, // 眼 黑
  cheek: 0xffb3b3, // 腮红 粉
  foot:  0xf39c12, // 腿脚 橙
  frame: 0xff5a3c, // 车架 珊瑚红
  tire:  0x2b2b33, // 轮胎 深
  rim:   0xe9e9ee, // 轮毂/辐条 浅
  seat:  0x5a4632, // 车座 棕
  bar:   0x2b2b33, // 车把 深
};

// ---------- 共享材质 / 几何 ----------
const unit = new THREE.BoxGeometry(1, 1, 1);
const matCache = new Map();
const matFor = (color) => {
  if (!matCache.has(color)) {
    matCache.set(color, new THREE.MeshStandardMaterial({
      color, roughness: 0.92, metalness: 0.0, flatShading: true,
    }));
  }
  return matCache.get(color);
};
const cubeAt = (x, y, z, color, parent) => {
  const cube = new THREE.Mesh(unit, matFor(color));
  cube.castShadow = true; cube.receiveShadow = true;
  cube.position.set(x, y, z);
  parent.add(cube);
  return cube;
};

// ==========================================================
//  小鸟 + 车架(静态体素)—— 全部单位方块,整只鸟 ≤ 15×15
//  x=前后(大=前/喙), y=上下, z=左右
// ==========================================================
const V = new Map();
const put = (x, y, z, color) => V.set(`${x},${y},${z}`, { x, y, z, color });
const fill = (x0, x1, y0, y1, z0, z1, color) => {
  for (let x = x0; x <= x1; x++)
    for (let y = y0; y <= y1; y++)
      for (let z = z0; z <= z1; z++) put(x, y, z, color);
};

// —— 小鸟(架在车上,腿踩到踏板)——
fill(0, 3, 7, 9, -1, 1, C.white);    // 身体
fill(1, 3, 10, 12, -1, 1, C.white);  // 头
fill(-1, -1, 8, 9, -1, 1, C.white);  // 尾巴
// 腿:左右两条,从身体底伸到踏板
fill(1, 1, 3, 6, -1, -1, C.foot);
fill(1, 1, 3, 6, 1, 1, C.foot);
put(2, 3, -1, C.foot); put(2, 3, 1, C.foot);   // 脚趾
// 喙:小,上下两层
put(4, 11, 0, C.beak);   // 上层
put(4, 10, 0, C.beak);   // 下层
// 眼睛 + 腮红 + 呆毛
put(3, 11, 1, C.eye);  put(3, 11, -1, C.eye);
put(2, 10, 1, C.cheek); put(2, 10, -1, C.cheek);
put(2, 13, 0, C.white); put(2, 14, 0, C.white);

// —— 车架(方块搭)——
fill(-3, 6, 2, 2, 0, 0, C.frame);   // 下管:连接前后轮轴
fill(0, 0, 3, 5, 0, 0, C.frame);    // 座管
fill(5, 5, 3, 6, 0, 0, C.frame);    // 头管
fill(-1, 1, 6, 6, -1, 1, C.seat);   // 车座
fill(5, 5, 7, 7, -1, 1, C.bar);     // 车把横梁
put(2, 2, -1, C.bar); put(2, 2, 1, C.bar); // 脚踏

const staticGroup = new THREE.Group();
for (const v of V.values()) cubeAt(v.x, v.y, v.z, v.color, staticGroup);

// ==========================================================
//  方块车轮(独立组,可绕轴旋转)
// ==========================================================
const wheels = [];
function makeWheel(cx, cy) {
  const g = new THREE.Group();
  for (let gx = -2; gx <= 2; gx++) {
    for (let gy = -2; gy <= 2; gy++) {
      const d = Math.hypot(gx, gy);
      let color = null;
      if (d >= 1.7 && d <= 2.35) color = C.tire;                 // 外圈(方轮)
      else if (d === 0) color = C.rim;                           // 轮毂
      else if ((gx === 0 || gy === 0) && d <= 1.2) color = C.rim; // 十字辐条
      if (color) for (const z of [-1, 0, 1]) cubeAt(gx, gy, z, color, g);
    }
  }
  g.position.set(cx, cy, 0);
  wheels.push(g);
  return g;
}
const wheelBack  = makeWheel(-3, 2);
const wheelFront = makeWheel(6, 2);

// ==========================================================
//  组装 + 动画
// ==========================================================
const rig = new THREE.Group();
rig.add(staticGroup, wheelBack, wheelFront);
scene.add(rig);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  for (const w of wheels) w.rotation.z -= 0.08;   // 轮子转
  rig.position.y = Math.sin(t * 2.2) * 0.08;       // 骑行轻颠
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
